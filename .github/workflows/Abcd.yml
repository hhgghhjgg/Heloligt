name: Manhwa OCR + Translate + WAN Inpaint

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'آدرس عکس مانهوا'
        required: true
        default: 'https://i.imgur.com/example.jpg'
      source_lang:
        description: 'زبان مبدأ'
        required: false
        default: 'Korean'

permissions:
  models: read
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          pip install -q requests pillow manga-ocr torch torchvision gradio_client

      - name: Download Image
        run: |
          mkdir -p manhwa
          curl -L -o manhwa/original.jpg "${{ github.event.inputs.image_url }}"
          echo "✅ Downloaded"

      # ============== مرحله ۱: OCR ==============
      - name: Step 1 - OCR
        run: |
          python3 << 'EOF'
          from manga_ocr import MangaOcr

          mocr = MangaOcr()
          text = mocr("manhwa/original.jpg")
          print(f"📝 OCR Text: {text}")
          open("manhwa/text_original.txt", "w", encoding="utf-8").write(text)
          EOF

      # ============== مرحله ۲: ترجمه با GitHub Models ==============
      - name: Step 2 - Translate with GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_LANG: ${{ github.event.inputs.source_lang }}
        run: |
          TEXT=$(cat manhwa/text_original.txt)
          
          python3 << 'EOF'
          import requests, os

          text = open("manhwa/text_original.txt").read()
          token = os.environ["GITHUB_TOKEN"]
          source_lang = os.environ["SOURCE_LANG"]

          prompt = f"""Translate this manhwa text from {source_lang} to Persian (فارسی). 
          Keep it natural, fluent, and suitable for manhwa speech bubbles.
          Return ONLY the translation, nothing else.
          
          Original text:
          {text}"""

          print("🤖 Calling GitHub Models...")
          resp = requests.post(
              "https://models.inference.ai.azure.com/chat/completions",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              json={
                  "model": "gpt-4o-mini",
                  "messages": [{"role": "user", "content": prompt}],
                  "max_tokens": 500
              },
              timeout=30
          )

          if resp.status_code == 200:
              translated = resp.json()["choices"][0]["message"]["content"]
              print(f"📝 Translated: {translated}")
              open("manhwa/text_translated.txt", "w", encoding="utf-8").write(translated)
          else:
              print(f"❌ Error: {resp.status_code}")
              print(resp.text[:300])
          EOF

      # ============== مرحله ۳: WAN Inpainting ==============
      - name: Step 3 - WAN Inpainting
        run: |
          python3 << 'EOF'
          import time
          from gradio_client import Client, file

          print("🖼️ Connecting to WAN Inpainting Space...")
          client = Client("https://instantx-qwen-image-controlnet-inpainting.hf.space/")

          print("📤 Sending image for inpainting...")
          result = client.predict(
              image=file("manhwa/original.jpg"),
              prompt="Remove all text and speech bubbles from this manga panel, clean inpainting",
              negative_prompt="text, watermark, low quality, blurry",
              guidance_scale=7.0,
              num_inference_steps=28,
              api_name="/predict"
          )

          print("✅ Inpainting Done!")

          # نتیجه می‌تونه یه رشته (آدرس فایل) یا دیکشنری باشه
          if isinstance(result, str):
              with open(result, "rb") as src:
                  with open("manhwa/cleaned.jpg", "wb") as dst:
                      dst.write(src.read())
          elif isinstance(result, dict):
              if "image" in result:
                  img_path = result["image"]
                  with open(img_path, "rb") as src:
                      with open("manhwa/cleaned.jpg", "wb") as dst:
                          dst.write(src.read())
              else:
                  print(f"⚠️ Unexpected result format: {result.keys()}")
          else:
              print(f"⚠️ Unexpected type: {type(result)}")
          EOF

      # ============== ذخیره ==============
      - name: Save Results
        run: |
          FOLDER="manhwa-results/$(date +%Y%m%d_%H%M)"
          mkdir -p "$FOLDER"
          cp manhwa/original.jpg "$FOLDER/01_original.jpg"
          cp manhwa/cleaned.jpg "$FOLDER/02_cleaned.jpg" 2>/dev/null || echo "No cleaned image"
          cp manhwa/text_original.txt "$FOLDER/03_original.txt"
          cp manhwa/text_translated.txt "$FOLDER/04_translated.txt"

      - name: Commit
        run: |
          git config user.name "ManhwaBot"
          git config user.email "bot@manhwa"
          git add manhwa-results/
          git commit -m "📖 Translation $(date +%H:%M)" || echo "Nothing"
          git push || true
