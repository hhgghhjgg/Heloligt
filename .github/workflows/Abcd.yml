name: Download CGTrader with JS Execution

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: 'CGTrader model URL'
        required: true
        type: string
        default: 'https://www.cgtrader.com/3d-models/character/woman/anime-character-casual-female-sleeveless-c092f010-d071-4994-97d2-586d0f24542a'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s http://localhost:8191/v1 | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then echo "✅ Ready"; break; fi
            sleep 4
          done
      - name: Install Dependencies
        run: pip install requests
      - name: Extract Download Link
        run: |
          python3 << 'PYEOF'
          import requests, re, os, json

          model_url = "${{ github.event.inputs.model_url }}"
          uid = model_url.rstrip("/").split("-")[-1]
          print(f"🎯 Model UID: {uid}")

          # --- ۱. تحلیل شبکه‌ای صفحه با مرورگر ---
          # به FlareSolverr می‌گیم کل فعالیت شبکه رو هم ثبت کنه
          r = requests.post("http://localhost:8191/v1", json={
              "cmd": "request.get",
              "url": model_url,
              "maxTimeout": 120000,
              "returnOnlyCookies": False,
              "download": True,
              "returnRawHtml": True
          }, timeout=180)

          d = r.json()
          if d.get("status") != "ok":
              print(f"❌ FlareSolverr failed: {d.get('message')}")
              exit(1)

          html = d["solution"].get("response", "")
          cookies = d["solution"].get("cookies", [])
          ua = d["solution"].get("userAgent", "")
          print(f"✅ Page loaded: {len(html)} bytes, {len(cookies)} cookies")

          ses = requests.Session()
          ses.headers.update({"User-Agent": ua, "Accept": "*/*"})
          for c in cookies: ses.cookies.set(c["name"], c["value"])

          # --- ۲. استخراج API Key از HTML ---
          apikeys = re.findall(r'[a-f0-9]{32}', html)
          print(f"🔑 Found {len(apikeys)} potential API keys")

          # --- ۳. استخراج تمام لینک‌های فایل از HTML ---
          file_links = []
          patterns = [
              r'"downloadUrl"\s*:\s*"([^"]+)"',
              r'"(https?://[^"]+\.(?:fbx|obj|gltf|glb|blend|zip|rar)[^"]*)"',
              r'"file"\s*:\s*"([^"]+)"',
              r'"url"\s*:\s*"(https?://[^"]+/(?:download|files|assets)/[^"]+)"',
              r'href="(/(?:download|files)/[^"]+)"',
          ]
          for p in patterns:
              matches = re.findall(p, html, re.IGNORECASE)
              file_links.extend(matches)

          # --- ۴. حدس API و تلاش برای دانلود ---
          possible_endpoints = [
              f"https://www.cgtrader.com/api/v1/3d-models/{uid}/download",
              f"https://www.cgtrader.com/api/models/{uid}/files",
              f"https://www.cgtrader.com/download/{uid}",
              f"https://download.cgtrader.com/{uid}",
              f"https://www.cgtrader.com/3d-models/download/{uid}",
          ]
          
          for apikey in apikeys[:5]:
              possible_endpoints.append(f"https://www.cgtrader.com/api/models/{uid}/download?key={apikey}")

          all_urls = list(set(file_links + possible_endpoints))
          print(f"🔗 Testing {len(all_urls)} URLs...")

          os.makedirs("3d-models", exist_ok=True)
          downloaded = False

          for idx, durl in enumerate(all_urls[:30]):
              if not durl.startswith("http"): durl = "https://www.cgtrader.com" + durl
              print(f"📥 [{idx+1}] {durl[:120]}")
              
              try:
                  dr = ses.get(durl, timeout=60, stream=True)
                  cl = int(dr.headers.get("Content-Length", "0"))
                  ct = dr.headers.get("Content-Type", "")
                  
                  if dr.status_code == 200 and cl > 5000:
                      if "zip" in ct or "octet" in ct or "model" in ct or any(ext in durl.lower() for ext in ['.fbx','.obj','.glb','.blend']):
                          cd = dr.headers.get("Content-Disposition", "")
                          fname = f"model_{uid}.zip"
                          m = re.search(r'filename="?([^"]+)"?', cd)
                          if m: fname = m.group(1)
                          fname = re.sub(r'[\\/*?:"<>|]', '_', fname)
                          
                          path = f"3d-models/{fname}"
                          with open(path, "wb") as f:
                              for chunk in dr.iter_content(8192): f.write(chunk)
                          print(f"  ✅ Saved: {fname} ({os.path.getsize(path)//1024}KB)")
                          downloaded = True
                          break
                  else:
                      print(f"  ⚠️ HTTP {dr.status_code}, size={cl}")
              except Exception as e:
                  print(f"  ❌ {str(e)[:50]}")

          if not downloaded:
              print("❌ Could not find download link.")
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 3d-models/ 2>/dev/null || true
          git commit -m "📦 CGTrader model" || echo "Nothing"
          git pull --rebase && git push || true
