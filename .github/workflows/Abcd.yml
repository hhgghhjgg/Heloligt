name: Browser Stream via Puppeteer

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'آدرس سایتی که می‌خوای باز بشه (پیش‌فرض: wikipedia.org)'
        required: false
        default: 'https://wikipedia.org'
      port:
        description: 'پورت سرور WebSocket (پیش‌فرض: 8080)'
        required: false
        default: '8080'

permissions:
  contents: write

jobs:
  browser-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # ۶ ساعت

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and install Puppeteer
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install puppeteer ws

      - name: Start headless browser and open target URL
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          PORT: ${{ github.event.inputs.port }}
        run: |
          cat > browser-stream.js << 'EOF'
          const puppeteer = require('puppeteer');
          const WebSocket = require('ws');
          const http = require('http');
          const fs = require('fs');
          const port = process.env.PORT || 8080;
          const targetURL = process.env.TARGET_URL || 'https://wikipedia.org';

          (async () => {
            // 1. Launch headless browser with sandbox disabled
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.goto(targetURL, { waitUntil: 'networkidle2' });

            // 2. Start a local WebSocket server so KSWEB can talk to us
            const server = http.createServer((req, res) => {
              res.writeHead(200, { 'Content-Type': 'text/plain' });
              res.end('WebSocket server is running');
            });
            const wss = new WebSocket.Server({ server });
            server.listen(port, () => console.log(`WebSocket server listening on ws://localhost:${port}`));

            // 3. Write WS address to a file in the repo so KSWEB can find it
            const wsAddress = `ws://localhost:${port}`;
            console.log(`Writing WS address to ws_address.txt: ${wsAddress}`);
            fs.writeFileSync('ws_address.txt', wsAddress);

            // 4. Listen for commands from KSWEB
            wss.on('connection', (ws) => {
              console.log('KSWEB connected to WebSocket');
              ws.on('message', async (msg) => {
                const command = msg.toString().trim();
                console.log(`Received command: ${command}`);

                if (command.startsWith('NAVIGATE ')) {
                  const url = command.replace('NAVIGATE ', '');
                  console.log(`Navigating to ${url}`);
                  await page.goto(url, { waitUntil: 'networkidle2' });
                  ws.send('NAVIGATED ' + url);
                } else if (command === 'SCREENSHOT') {
                  const screenshot = await page.screenshot({ encoding: 'base64' });
                  ws.send(`SCREENSHOT ${screenshot}`);
                } else if (command === 'HTML') {
                  const html = await page.content();
                  ws.send(`HTML ${Buffer.from(html).toString('base64')}`);
                } else if (command === 'URL') {
                  ws.send(`URL ${await page.url()}`);
                } else if (command.startsWith('CLICK ')) {
                  const selector = command.replace('CLICK ', '');
                  await page.click(selector);
                  ws.send('CLICKED ' + selector);
                } else if (command.startsWith('TYPE ')) {
                  const parts = command.replace('TYPE ', '').split('|');
                  if (parts.length === 2) {
                    await page.type(parts[0], parts[1]);
                    ws.send('TYPED ' + parts[0]);
                  }
                }
              });
            });

            // Keep the process alive
            console.log('Browser is ready! Waiting for commands...');
          })();
          EOF
          node browser-stream.js &

      - name: Wait for browser to be ready and commit WS address
        run: |
          sleep 5
          if [ -f ws_address.txt ]; then
            echo "✅ WebSocket server started at: $(cat ws_address.txt)"
          else
            echo "❌ ws_address.txt not found!" && exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ws_address.txt
          git commit -m "Update WebSocket address" || echo "Nothing to commit"
          git push

      - name: Keep alive for 6 hours
        run: sleep 21600
