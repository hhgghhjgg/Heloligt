name: Fetch manhwaus with Clean IP and Save HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch manhwaus with Clean IPs
        run: |
          echo "🧪 Fetching manhwaus.org with Clean Cloudflare IPs..."
          echo ""
          
          # لیست IP های تمیز
          cat << 'EOF' > clean_ips.txt
          162.159.192.1
          162.159.193.1
          162.159.195.1
          162.159.204.1
          188.114.96.1
          188.114.97.1
          EOF
          
          FOUND=false
          
          while IFS= read -r IP; do
            [ -z "$IP" ] && continue
            [ "$FOUND" = true ] && continue
            
            echo "🔹 Trying: $IP"
            
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -k \
              --resolve "manhwaus.org:443:$IP" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              --connect-timeout 10 --max-time 20 \
              "https://manhwaus.org" 2>/dev/null || echo "000")
            
            if [ "$HTTP" = "200" ]; then
              echo "  ✅ Connected! Downloading HTML..."
              
              # پوشه ذخیره
              TIMESTAMP=$(date '+%Y-%m-%d_%H-%M')
              OUTPUT_DIR="sites/manhwaus/${TIMESTAMP}"
              mkdir -p "$OUTPUT_DIR"
              
              # دانلود HTML
              curl -k -L \
                --resolve "manhwaus.org:443:$IP" \
                -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                --connect-timeout 10 --max-time 30 \
                -o "${OUTPUT_DIR}/index.html" \
                "https://manhwaus.org"
              
              if [ -f "${OUTPUT_DIR}/index.html" ]; then
                SIZE=$(stat -c%s "${OUTPUT_DIR}/index.html")
                echo "  ✅ HTML saved: ${OUTPUT_DIR}/index.html (${SIZE} bytes)"
                echo "$IP | HTTP:$HTTP | ✅ SUCCESS | Saved to: ${OUTPUT_DIR}" >> results.txt
                FOUND=true
              fi
            elif [ "$HTTP" = "403" ]; then
              echo "  ❌ Blocked (403)"
              echo "$IP | HTTP:$HTTP | ❌ BLOCKED" >> results.txt
            else
              echo "  ⚠️ HTTP $HTTP"
              echo "$IP | HTTP:$HTTP | ⚠️" >> results.txt
            fi
            
          done < clean_ips.txt
          
          echo ""
          echo "===== RESULTS ====="
          cat results.txt
          
          if [ "$FOUND" = false ]; then
            echo "❌ None of the IPs worked for manhwaus.org"
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/manhwaus/ results.txt clean_ips.txt 2>/dev/null || true
          git commit -m "🌐 manhwaus.org HTML with Clean IP | $(date '+%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git pull --rebase && git push || true
