name: دانلودر پورن هاب

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video, search, or playlist'
        required: true
        type: string
      output_folder:
        description: 'Folder where the video will be saved'
        required: false
        type: string
        default: 'downloads'
      quality:
        description: 'Video quality'
        required: true
        type: string
        default: 'bestvideo[height<=240]+bestaudio/best[height<=240][ext=mp4]/best[height<=240]'
      sort_by:
        description: 'Sort order'
        required: false
        type: choice
        options:
          - 'none (default)'
          - 'newest first'
          - 'oldest first'
          - 'random'
        default: 'none (default)'
      exclude_keywords:
        description: 'Keywords to exclude (comma)'
        required: false
        type: string
        default: ''
      max_duration_minutes:
        description: 'Max duration in minutes (0=no limit)'
        required: false
        type: string
        default: '0'
      start:
        description: 'Start from video #'
        required: false
        type: string
        default: '1'
      end:
        description: 'End at video #'
        required: false
        type: string
        default: '5'

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Build filter
        id: filters
        run: |
          FILTER_PARTS=()

          if [ "${{ github.event.inputs.max_duration_minutes }}" != "0" ]; then
            SEC=$(( ${{ github.event.inputs.max_duration_minutes }} * 60 ))
            FILTER_PARTS+=("duration<${SEC}")
          fi

          if [ -n "${{ github.event.inputs.exclude_keywords }}" ]; then
            IFS=',' read -ra KW <<< "${{ github.event.inputs.exclude_keywords }}"
            for kw in "${KW[@]}"; do
              kw=$(echo "$kw" | xargs)
              if [ -n "$kw" ]; then
                FILTER_PARTS+=("title!~=(?i)${kw}")
              fi
            done
          fi

          FILTER=""
          for part in "${FILTER_PARTS[@]}"; do
            if [ -z "$FILTER" ]; then
              FILTER="$part"
            else
              FILTER="${FILTER}&${part}"
            fi
          done

          echo "filter=${FILTER}" >> $GITHUB_OUTPUT
          echo "Filter: ${FILTER:-none}"

      - name: Download
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          mkdir -p "$FOLDER"

          SORT=""
          case "${{ github.event.inputs.sort_by }}" in
            "newest first") SORT="--playlist-reverse" ;;
            "random")       SORT="--playlist-random" ;;
          esac

          FILTER="${{ steps.filters.outputs.filter }}"

          for i in 1 2 3 4 5; do
            echo "Attempt $i/5"
            CMD=(yt-dlp
              --output "./${FOLDER}/%(playlist_index)s - %(uploader)s - %(title)s - %(id)s.%(ext)s"
              --format "${{ github.event.inputs.quality }}"
              --merge-output-format mp4
              --playlist-start "${{ github.event.inputs.start }}"
              --playlist-end "${{ github.event.inputs.end }}"
              $SORT
              --retries 3 --fragment-retries 10
              --no-check-certificate --geo-bypass --no-color --ignore-errors --newline
            )
            if [ -n "$FILTER" ]; then
              CMD+=(--match-filter "$FILTER")
            fi
            CMD+=("${{ github.event.inputs.url }}")
            "${CMD[@]}" && break
            sleep 5
          done

          find "$FOLDER" -type f | while read -r f; do
            echo "  $(basename "$f") ($(stat -c %s "$f") bytes)"
          done

      - name: Split large files
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          cd "$FOLDER"

          find . -maxdepth 1 -type f | while read -r FILE; do
            FILENAME=$(basename "$FILE")
            SIZE=$(stat -c %s "$FILE")
            if [ "$SIZE" -gt 104857600 ]; then
              mkdir -p "../splits/${FILENAME}"
              split -b 95M "$FILE" "../splits/${FILENAME}/part_"
              rm "$FILE"
              echo "Split: ${FILENAME}"
            fi
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/ splits/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Downloaded videos"
            git pull --rebase && git push
          fi
