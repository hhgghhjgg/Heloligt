name: VLESS Proxy on GitHub Actions

on:
  workflow_dispatch:

jobs:
  vless:
    runs-on: ubuntu-latest
    timeout-minutes: 340  # تقریباً ۵.۵ ساعت

    steps:
      - name: Setup XRay (VLESS + WebSocket + TLS)
        run: |
          # ۱. دانلود XRay-core
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip xray.zip -d xray
          chmod +x xray/xray
          
          # ۲. تولید UUID تصادفی
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID: $UUID"
          
          # ۳. ساخت فایل کانفیگ XRay
          cat > xray/config.json << 'XRAYEOF'
          {
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "port": 8080,
              "listen": "0.0.0.0",
              "protocol": "vless",
              "settings": {
                "clients": [{
                  "id": "PLACEHOLDER_UUID",
                  "flow": ""
                }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "ws",
                "wsSettings": { "path": "/ws" }
              }
            }],
            "outbounds": [{
              "protocol": "freedom",
              "settings": {}
            }]
          }
          XRAYEOF
          
          # ۴. جایگزینی UUID
          sed -i "s/PLACEHOLDER_UUID/$UUID/g" xray/config.json
          
          # ۵. راه‌اندازی XRay در پس‌زمینه
          cd xray && ./xray run -config config.json &
          
          # ۶. نمایش کانفیگ خروجی
          PUBLIC_IP=$(curl -s https://api.ipify.org)
          echo ""
          echo "=============================================="
          echo "  کانفیگ VLESS شما:"
          echo "=============================================="
          echo ""
          echo "پروتکل: vless"
          echo "آدرس: ${PUBLIC_IP}"
          echo "پورت: 8080"
          echo "UUID: ${UUID}"
          echo "نوع: ws"
          echo "مسیر: /ws"
          echo "TLS: none"
          echo ""
          echo "لینک کانفیگ:"
          echo "vless://${UUID}@${PUBLIC_IP}:8080?type=ws&path=%2Fws#GitHub-VLESS"
          echo ""
          echo "=============================================="
          echo "  برای تست با Curl (از یه ترمینال دیگه):"
          echo "  curl -x socks5://${PUBLIC_IP}:1080 https://api.ipify.org"
          echo "=============================================="

      - name: Keep Alive (۵.۵ ساعت)
        run: |
          # این مرحله رانر رو تا ۵.۵ ساعت زنده نگه میداره
          sleep 19800  # ۵.۵ ساعت = ۱۹۸۰۰ ثانیه
