name: Download 3D Models from Hugging Face

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: 'Hugging Face Dataset Repo ID'
        required: true
        type: string
        default: 'allenai/objaverse-xl'
      format:
        description: 'File format'
        required: false
        type: choice
        options:
          - 'glb'
          - 'gltf'
          - 'obj'
          - 'fbx'
          - 'all'
        default: 'glb'
      max_models:
        description: 'Max number of models to download'
        required: false
        type: string
        default: '3'
      subfolder:
        description: 'Subfolder within the dataset (leave empty if none)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: pip install requests

      - name: List and Download Models
        env:
          REPO_ID: ${{ github.event.inputs.repo_id }}
          FORMAT: ${{ github.event.inputs.format }}
          MAX_MODELS: ${{ github.event.inputs.max_models }}
          SUB: ${{ github.event.inputs.subfolder }}
        run: |
          python3 << 'PYEOF'
          import requests, os, sys, subprocess, time

          repo_id = os.environ["REPO_ID"]
          fmt = os.environ["FORMAT"]
          max_models = int(os.environ["MAX_MODELS"])
          sub = os.environ["SUB"]

          print(f"📡 Fetching file list from: {repo_id}")
          api_url = f"https://huggingface.co/api/datasets/{repo_id}"
          resp = requests.get(api_url, timeout=30)
          if resp.status_code != 200:
              print(f"❌ API Error: {resp.status_code}")
              sys.exit(1)

          siblings = resp.json().get("siblings", [])
          print(f"📊 Total files: {len(siblings)}")

          # Filter by format and subfolder
          extensions = [fmt] if fmt != "all" else ["glb", "gltf", "obj", "fbx"]

          matching = []
          for sib in siblings:
              fname = sib["rfilename"]
              if sub and not fname.startswith(sub):
                  continue
              if any(fname.lower().endswith(f".{ext}") or fname.lower().endswith(f".{ext}.gz") for ext in extensions):
                  matching.append(fname)

          print(f"🎯 Matching files: {len(matching)}")

          if not matching:
              print("⚠️ No matching files found!")
              sys.exit(0)

          # Pick first N files
          to_download = matching[:max_models]
          print(f"📥 Downloading {len(to_download)} files...")

          out_dir = "3d-models"
          os.makedirs(out_dir, exist_ok=True)

          for idx, fname in enumerate(to_download):
              url = f"https://huggingface.co/datasets/{repo_id}/resolve/main/{fname}"
              local_name = os.path.basename(fname)
              local_path = os.path.join(out_dir, local_name)

              print(f"  [{idx+1}/{len(to_download)}] {local_name}")
              # Use curl with retry
              for attempt in range(3):
                  ret = subprocess.run([
                      "curl", "-L", "-o", local_path,
                      "--retry", "3", "-C", "-",
                      "--max-time", "300",
                      url
                  ], capture_output=True, text=True)
                  if ret.returncode == 0:
                      sz = os.path.getsize(local_path)
                      print(f"    ✅ Done ({sz//1024}KB)")
                      break
                  else:
                      if attempt < 2:
                          print(f"    ⚠️ Retry {attempt+1}...")
                          time.sleep(5)
                      else:
                          print(f"    ❌ Failed: {ret.stderr[:100]}")

          print(f"\n✅ Downloaded to: {out_dir}/")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 3d-models/ 2>/dev/null || true
          git commit -m "📦 3D models from ${{ github.event.inputs.repo_id }}" || echo "Nothing"
          git pull --rebase && git push || true
