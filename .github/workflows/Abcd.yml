name: دانلودر پورن هاب

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video, search, or playlist'
        required: true
        type: string
      output_folder:
        description: 'Folder where the video will be saved'
        required: false
        type: string
        default: 'downloads'
      quality:
        description: 'Video quality'
        required: true
        type: string
        default: 'bestvideo[height<=240]+bestaudio/best[height<=240][ext=mp4]/best[height<=240]'
      sort_by:
        description: 'Sort order'
        required: false
        type: choice
        options:
          - 'none (default)'
          - 'newest first'
          - 'oldest first'
          - 'random'
        default: 'none (default)'
      exclude_keywords:
        description: 'Keywords to exclude (comma)'
        required: false
        type: string
        default: ''
      max_duration_minutes:
        description: 'Max duration in minutes (0=no limit)'
        required: false
        type: string
        default: '0'
      start:
        description: 'Start from video #'
        required: false
        type: string
        default: '1'
      end:
        description: 'End at video #'
        required: false
        type: string
        default: '5'

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp and bc
        run: |
          pip install yt-dlp
          sudo apt-get update && sudo apt-get install -y bc

      - name: Download
        run: |
          mkdir -p downloads
          touch marker

          SORT=""
          case "${{ github.event.inputs.sort_by }}" in
            "newest first") SORT="--playlist-reverse" ;;
            "random")       SORT="--playlist-random" ;;
          esac

          FILTER=""
          if [ "${{ github.event.inputs.max_duration_minutes }}" != "0" ]; then
            SEC=$(( ${{ github.event.inputs.max_duration_minutes }} * 60 ))
            FILTER="duration < ${SEC}"
          fi

          if [ -n "${{ github.event.inputs.exclude_keywords }}" ]; then
            IFS=',' read -ra KW <<< "${{ github.event.inputs.exclude_keywords }}"
            for kw in "${KW[@]}"; do
              kw=$(echo "$kw" | xargs)
              if [ -n "$kw" ]; then
                if [ -n "$FILTER" ]; then FILTER="${FILTER} & "; fi
                FILTER="${FILTER}title !* '${kw}'"
              fi
            done
          fi

          for i in 1 2 3 4 5; do
            echo "Attempt $i/5"
            if [ -n "$FILTER" ]; then
              yt-dlp \
                --output "./downloads/%(playlist_index)s - %(uploader)s - %(title)s - %(id)s.%(ext)s" \
                --format "${{ github.event.inputs.quality }}" \
                --merge-output-format mp4 \
                --playlist-start "${{ github.event.inputs.start }}" \
                --playlist-end "${{ github.event.inputs.end }}" \
                $SORT \
                --match-filter "$FILTER" \
                --retries 3 --fragment-retries 10 \
                --no-check-certificate --geo-bypass --no-color --ignore-errors --newline \
                "${{ github.event.inputs.url }}" && break
            else
              yt-dlp \
                --output "./downloads/%(playlist_index)s - %(uploader)s - %(title)s - %(id)s.%(ext)s" \
                --format "${{ github.event.inputs.quality }}" \
                --merge-output-format mp4 \
                --playlist-start "${{ github.event.inputs.start }}" \
                --playlist-end "${{ github.event.inputs.end }}" \
                $SORT \
                --retries 3 --fragment-retries 10 \
                --no-check-certificate --geo-bypass --no-color --ignore-errors --newline \
                "${{ github.event.inputs.url }}" && break
            fi
            sleep 5
          done

          find downloads -type f -newer marker | while read -r f; do
            echo "  $(basename "$f") ($(stat -c %s "$f") bytes)"
          done

      - name: Install RAR
        run: sudo apt-get install -y rar

      - name: Split
        run: |
          cd downloads
          find . -maxdepth 1 -type f | while read -r FILE; do
            FILENAME=$(basename "$FILE")
            SIZE=$(stat -c %s "$FILE")
            SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
            if (( $(echo "$SIZE_MB > 99" | bc -l) )); then
              HEX=$(openssl rand -hex 3)
              NAME="${FILENAME%.*}_${HEX}"
              rar a -v95m -m5 -ep1 "${NAME}.rar" "$FILENAME"
              rm "$FILENAME"
            fi
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git commit -m "Downloaded videos" || echo "Nothing"
          git push
