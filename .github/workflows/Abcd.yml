name: Final Smart Download - Extract Link from Download Page

on:
  workflow_dispatch:
    inputs:
      model_page:
        description: 'لینک صفحه‌ی مدل'
        required: true
        default: 'https://open3dmodel.com/3d-models/3d-model-cute-anime-school-girl_116659.html'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: پاکسازی و نصب پیش‌نیازهای سیستم
        run: |
          rm -rf package.json package-lock.json node_modules
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates fonts-liberation \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 \
            libcups2t64 libdbus-1-3 libdrm2 libgbm1 libgtk-3-0t64 \
            libnspr4 libnss3 libu2f-udev libxcomposite1 libxdamage1 \
            libxfixes3 libxkbcommon0 libxrandr2 xdg-utils

      - name: نصب Puppeteer کامل + افزونه مخفی‌ساز
        run: |
          npm init -y
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: اجرای اسکریپت هوشمند دانلود
        env:
          MODEL_PAGE: ${{ inputs.model_page }}
        run: |
          node << 'SCRIPT_EOF'
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          const fs = require('fs');
          const path = require('path');
          const axios = require('axios'); // برای دانلود مستقیم

          puppeteer.use(StealthPlugin());

          const wait = ms => new Promise(r => setTimeout(r, ms));
          const modelPage = process.env.MODEL_PAGE;
          const downloadDir = path.resolve("3d-models");
          if (!fs.existsSync(downloadDir)) fs.mkdirSync(downloadDir, { recursive: true });

          // نصب axios در صورت نبود
          try { require.resolve('axios'); } catch(e) {
            require('child_process').execSync('npm install axios', { stdio: 'ignore' });
          }

          (async () => {
            let browser = null;
            let realFileUrl = null;

            try {
              console.log("🚀 راه‌اندازی مرورگر مخفی‌کار...");
              browser = await puppeteer.launch({
                headless: "new",
                args: ["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage", "--disable-gpu"]
              });

              const page = await browser.newPage();
              await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");

              console.log(`🌐 بارگذاری صفحه مدل: ${modelPage}`);
              await page.goto(modelPage, { waitUntil: "networkidle2", timeout: 60000 });

              // کلیک روی دکمه دانلود
              console.log("🔍 کلیک روی دکمه دانلود...");
              const downloadBtn = await page.waitForSelector('a[href*="download.php"]', { timeout: 15000 });
              if (!downloadBtn) throw new Error("دکمه دانلود پیدا نشد");

              // صبر می‌کنیم تا صفحه جدید باز شود
              const newPagePromise = new Promise(resolve => browser.once('targetcreated', async target => {
                const newPage = await target.page();
                if (newPage) resolve(newPage);
              }));

              await downloadBtn.click();
              console.log("⏳ منتظر باز شدن صفحه‌ی میانی دانلود...");
              const downloadPage = await newPagePromise;
              await downloadPage.bringToFront();
              await downloadPage.waitForNavigation({ waitUntil: "networkidle2", timeout: 30000 });

              console.log("📄 صفحه‌ی میانی بارگذاری شد. صبر برای اجرای جاوااسکریپت...");
              await wait(15000); // صبر طولانی برای تولید لینک نهایی

              // استخراج تمام لینک‌های موجود در صفحه
              const allLinks = await downloadPage.evaluate(() =>
                Array.from(document.querySelectorAll('a[href]')).map(a => ({
                  href: a.href,
                  text: a.textContent.trim()
                }))
              );

              console.log(`🔗 تعداد کل لینک‌ها در صفحه: ${allLinks.length}`);

              // اولویت با لینک‌هایی که شبیه فایل‌های سه‌بعدی هستند
              const patterns = [/\.(zip|rar|7z|fbx|obj|max|blend|stl|glb|gltf)$/i, /download/i, /token_id=/i];
              for (const pat of patterns) {
                const found = allLinks.find(l => pat.test(l.href) || pat.test(l.text));
                if (found) {
                  realFileUrl = found.href;
                  console.log(`✅ لینک احتمالی دانلود واقعی پیدا شد: ${realFileUrl}`);
                  break;
                }
              }

              // اگر پیدا نشد، کل لینک‌ها را چاپ کن
              if (!realFileUrl) {
                console.log("❌ هیچ لینک مشخصی پیدا نشد. لیست کامل:");
                allLinks.forEach(l => console.log(`  - ${l.href.substring(0,100)} (${l.text})`));
                await downloadPage.screenshot({ path: "debug_download_page.png" });
              }

              // اگر لینکی پیدا شد، دانلود با axios و کوکی‌های مرورگر
              if (realFileUrl) {
                console.log(`📥 دانلود فایل نهایی از: ${realFileUrl}`);
                const cookies = await downloadPage.cookies();
                const cStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');
                const resp = await axios.get(realFileUrl, {
                  headers: {
                    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                    "Referer": downloadPage.url(),
                    "Cookie": cStr
                  },
                  responseType: 'stream'
                });

                let fname = 'model.zip';
                const cd = resp.headers['content-disposition'] || '';
                const match = cd.match(/filename\s*=\s*"?([^"]+)"?/i);
                if (match) fname = match[1];
                else {
                  const urlPath = new URL(realFileUrl).pathname;
                  fname = path.basename(urlPath) || 'model.zip';
                }
                fname = fname.replace(/[/\\?%*:|"<>]/g, '_');
                const fpath = path.join(downloadDir, fname);

                const writer = fs.createWriteStream(fpath);
                resp.data.pipe(writer);
                await new Promise((resolve, reject) => {
                  writer.on('finish', resolve);
                  writer.on('error', reject);
                });

                console.log(`✅ ذخیره شد: ${fname} (${Math.round(fs.statSync(fpath).size/1024)} KB)`);
              }

              await downloadPage.screenshot({ path: "screenshot_final.png" });
              console.log("📸 اسکرین‌شات ذخیره شد.");

            } catch (err) {
              console.error("❌ خطا:", err.message);
              try { if (browser) await browser.close(); } catch(e) {}
            } finally {
              if (browser) {
                await browser.close();
                console.log("✔️ مرورگر بسته شد");
              }
            }

            // گزارش نهایی
            console.log("\n📁 فایل‌های موجود در 3d-models:");
            if (fs.existsSync(downloadDir)) {
              fs.readdirSync(downloadDir).forEach(f => {
                const s = fs.statSync(path.join(downloadDir, f));
                if (s.isFile()) console.log(`  📦 ${f} (${Math.round(s.size/1024)} KB)`);
              });
            }
            console.log("✨ پایان.");
          })();
          SCRIPT_EOF

      - name: کامیت تمام فایل‌های تولید شده
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p 3d-models
          git add -f 3d-models/ screenshot_final.png debug_download_page.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "هیچ فایلی برای کامیت وجود ندارد"
          else
            git commit -m "📦 دانلود مدل با استخراج هوشمند لینک"
            git pull --rebase && git push
            echo "✅ کامیت و پوش شد"
          fi

      - name: آپلود اسکرین‌شات‌ها برای بررسی
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshot_final.png
            debug_download_page.png
          retention-days: 7
