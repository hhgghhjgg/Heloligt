name: Download Manga Chapter with FlareSolverr + Clean IP

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'آدرس صفحه Reader فصل (مثلاً mgeko.cc)'
        required: true
        default: 'https://www.mgeko.cc/reader/en/im-the-king-of-wealth-in-the-three-realms-chapter-11-eng-li/'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -q requests beautifulsoup4

      - name: Wait for FlareSolverr
        run: |
          echo "⏳ Waiting for FlareSolverr..."
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8191/v1 2>/dev/null || echo "000")
            if [ "$status" = "200" ] || [ "$status" = "405" ]; then
              echo "✅ FlareSolverr ready (status: $status)"
              break
            fi
            sleep 2
          done

      - name: Fetch chapter page via FlareSolverr
        env:
          CHAPTER_URL: ${{ github.event.inputs.url }}
        run: |
          python3 << 'PYEOF'
          import os, json, requests, re, hashlib
          from bs4 import BeautifulSoup
          from datetime import datetime
          from urllib.parse import urljoin, urlparse
          from pathlib import Path

          chapter_url = os.environ["CHAPTER_URL"]
          domain = urlparse(chapter_url).netloc
          timestamp = datetime.now().strftime("%Y-%m-%d_%H-%M")
          output_dir = f"sites/{domain}/{timestamp}"
          Path(output_dir).mkdir(parents=True, exist_ok=True)

          # ============== مرحله ۱: دریافت صفحه با FlareSolverr ==============
          print(f"📡 Fetching via FlareSolverr: {chapter_url}")
          fs_url = "http://localhost:8191/v1"
          payload = {
              "cmd": "request.get",
              "url": chapter_url,
              "maxTimeout": 120000
          }
          resp = requests.post(fs_url, json=payload, timeout=150)
          data = resp.json()
          html = data.get("solution", {}).get("response", "")
          fs_status = data.get("status", "error")
          fs_message = data.get("message", "")

          print(f"  FlareSolverr status: {fs_status}")
          print(f"  FlareSolverr message: {fs_message}")

          if not html:
              print("❌ HTML دریافت نشد!")
              exit(1)

          # ذخیره HTML اصلی
          html_path = f"{output_dir}/page.html"
          with open(html_path, "w", encoding="utf-8") as f:
              f.write(html)
          print(f"✅ HTML ذخیره شد: {html_path}")

          # ============== مرحله ۲: استخراج لینک تصاویر ==============
          soup = BeautifulSoup(html, 'html.parser')
          images = []
          for img in soup.find_all('img'):
              src = img.get('src') or img.get('data-src') or img.get('data-lazy-src') or ''
              if not src:
                  continue
              # فیلتر تصاویر مانگا (معمولاً روی imgsrv4.com یا دامنه‌های مشابه)
              if any(kw in src.lower() for kw in ['imgsrv', 'mgeko.cc/media', 'manga', 'chapter', 'reader']):
                  full_url = urljoin(chapter_url, src)
                  images.append(full_url)

          # حذف تکراری‌ها
          images = list(dict.fromkeys(images))
          print(f"📊 {len(images)} تصویر پیدا شد")

          if len(images) == 0:
              print("❌ هیچ تصویری پیدا نشد")
              exit(1)

          # ذخیره لیست تصاویر
          with open(f"{output_dir}/images.json", "w", encoding="utf-8") as f:
              json.dump(images, f, indent=2)

          # ============== مرحله ۳: دانلود تصاویر با IP تمیز ==============
          CLEAN_IP = "162.159.192.1"

          for i, img_url in enumerate(images, 1):
              filename = f"{i:03d}.jpg"
              filepath = f"{output_dir}/{filename}"
              img_domain = urlparse(img_url).netloc

              print(f"📥 [{i}/{len(images)}] {img_url[:80]}...")

              # استفاده از curl با IP تمیز
              cmd = f'curl -sL --resolve "{img_domain}:443:{CLEAN_IP}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -H "Referer: {chapter_url}" -o "{filepath}" "{img_url}"'
              ret = os.system(cmd)

              if ret == 0 and os.path.exists(filepath) and os.path.getsize(filepath) > 100:
                  size_kb = os.path.getsize(filepath) // 1024
                  print(f"  ✅ ذخیره شد ({size_kb} KB)")
              else:
                  # تلاش دوباره با IP پشتیبان
                  BACKUP_IP = "162.159.193.1"
                  print(f"  ⚠️ تلاش مجدد با IP پشتیبان...")
                  cmd2 = f'curl -sL --resolve "{img_domain}:443:{BACKUP_IP}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -H "Referer: {chapter_url}" -o "{filepath}" "{img_url}"'
                  ret2 = os.system(cmd2)
                  if ret2 == 0 and os.path.exists(filepath) and os.path.getsize(filepath) > 100:
                      size_kb = os.path.getsize(filepath) // 1024
                      print(f"  ✅ ذخیره شد با IP پشتیبان ({size_kb} KB)")
                  else:
                      print(f"  ❌ دانلود ناموفق")

          print(f"✅ عملیات تمام شد! فایل‌ها در {output_dir}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/
          git commit -m "📥 Manga chapter: ${{ github.event.inputs.url }}" || echo "Nothing to commit"
          git pull --rebase && git push || true
