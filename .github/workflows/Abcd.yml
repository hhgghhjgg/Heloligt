name: دانلودر پورن هاب

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video, search, or playlist'
        required: true
        type: string
      output_folder:
        description: 'Folder where the video will be saved'
        required: false
        type: string
        default: 'downloads'
      quality:
        description: 'Video quality'
        required: true
        type: string
        default: 'bestvideo[height<=240]+bestaudio/best[height<=240][ext=mp4]/best[height<=240]'
      sort_by:
        description: 'Sort order'
        required: false
        type: choice
        options:
          - 'none (default)'
          - 'newest first'
          - 'oldest first'
          - 'random'
        default: 'none (default)'
      exclude_keywords:
        description: 'Keywords to exclude (comma)'
        required: false
        type: string
        default: ''
      max_duration_minutes:
        description: 'Max duration in minutes (0=no limit)'
        required: false
        type: string
        default: '0'
      start:
        description: 'Start from video #'
        required: false
        type: string
        default: '1'
      end:
        description: 'End at video #'
        required: false
        type: string
        default: '5'

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp and bc
        run: |
          pip install yt-dlp
          sudo apt-get update && sudo apt-get install -y bc

      - name: Build filter file
        run: |
          python3 << 'EOF'
          import os
          filter_parts = []
          max_dur = '${{ github.event.inputs.max_duration_minutes }}'
          if max_dur and max_dur != '0':
              sec = int(max_dur) * 60
              filter_parts.append(f"duration<{sec}")
          exclude = '${{ github.event.inputs.exclude_keywords }}'
          if exclude:
              for kw in exclude.split(','):
                  kw = kw.strip()
                  if kw:
                      filter_parts.append(f"title!~(?i){kw}")
          filter_str = '&'.join(filter_parts)
          with open('/tmp/yt_filter.txt', 'w') as f:
              f.write(filter_str)
          print(f"Filter: {filter_str if filter_str else 'none'}")
          EOF

      - name: Download
        run: |
          mkdir -p downloads
          touch marker

          SORT=""
          case "${{ github.event.inputs.sort_by }}" in
            "newest first") SORT="--playlist-reverse" ;;
            "random")       SORT="--playlist-random" ;;
          esac

          FILTER=$(cat /tmp/yt_filter.txt)

          for i in 1 2 3 4 5; do
            echo "Attempt $i/5"
            CMD=(yt-dlp
              --output "./downloads/%(playlist_index)s - %(uploader)s - %(title)s - %(id)s.%(ext)s"
              --format "${{ github.event.inputs.quality }}"
              --merge-output-format mp4
              --playlist-start "${{ github.event.inputs.start }}"
              --playlist-end "${{ github.event.inputs.end }}"
              $SORT
              --retries 3 --fragment-retries 10
              --no-check-certificate --geo-bypass --no-color --ignore-errors --newline
            )
            if [ -n "$FILTER" ]; then
              CMD+=(--match-filter "$FILTER")
            fi
            CMD+=("${{ github.event.inputs.url }}")
            "${CMD[@]}" && break
            sleep 5
          done

          find downloads -type f -newer marker | while read -r f; do
            echo "  $(basename "$f") ($(stat -c %s "$f") bytes)"
          done

      - name: Install RAR
        run: sudo apt-get install -y rar

      - name: Split
        run: |
          cd downloads
          find . -maxdepth 1 -type f | while read -r FILE; do
            FILENAME=$(basename "$FILE")
            SIZE=$(stat -c %s "$FILE")
            SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
            if (( $(echo "$SIZE_MB > 99" | bc -l) )); then
              HEX=$(openssl rand -hex 3)
              NAME="${FILENAME%.*}_${HEX}"
              rar a -v95m -m5 -ep1 "${NAME}.rar" "$FILENAME"
              rm "$FILENAME"
            fi
          done

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          git commit -m "Downloaded videos" || echo "Nothing"
          git push
