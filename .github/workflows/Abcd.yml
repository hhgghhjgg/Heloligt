name: Install XDriver and Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install XDriver + Chrome
        run: |
          # Chrome رو نصب کن
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb 2>/dev/null
          google-chrome --version

      - name: Test XDriver
        run: |
          python3 << 'PYEOF'
          # XDriver نیاز به نصب نداره، یه اسکریپت Python ساده‌ست
          # که Chrome رو با تنظیمات stealth راه میندازه
          
          import subprocess, sys
          
          print("Chrome installed:", subprocess.run(["which", "google-chrome"], capture_output=True).stdout.decode())
          
          # Check if we can run chrome headless
          try:
              result = subprocess.run([
                  "google-chrome",
                  "--headless",
                  "--no-sandbox",
                  "--disable-dev-shm-usage",
                  "--dump-dom",
                  "https://example.com"
              ], capture_output=True, timeout=30)
              
              if "Example Domain" in result.stdout.decode():
                  print("✅ Chrome works in headless mode!")
              else:
                  print("⚠️ Chrome ran but got unexpected output")
          except Exception as e:
              print(f"❌ Chrome headless error: {e}")
          PYEOF
