name: Manhwa OCR + Translate + WAN Inpaint (Vision AI)

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'آدرس عکس مانهوا (Raw URL)'
        required: true

permissions:
  models: read
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: pip install -q requests pillow gradio_client

      - name: Download & Validate Image
        run: |
          mkdir -p manhwa
          URL="${{ github.event.inputs.image_url }}"
          # Auto-convert blob to raw
          URL=$(echo "$URL" | sed 's|github.com/.*/blob/|raw.githubusercontent.com/|' | sed 's|/blob/|/|')
          echo "📥 Downloading: $URL"
          curl -L -o manhwa/original.jpg "$URL"
          python3 -c "
          from PIL import Image
          img = Image.open('manhwa/original.jpg')
          print(f'✅ Image loaded: {img.size}, {img.format}')
          "

      - name: Step 1 - OCR & Translate with GitHub Models Vision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests, base64, os, json

          # Read image and encode as base64
          with open("manhwa/original.jpg", "rb") as f:
              img_bytes = f.read()
          img_b64 = base64.b64encode(img_bytes).decode("utf-8")
          image_url = f"data:image/jpeg;base64,{img_b64}"

          prompt = """You are a manhwa translator. Read all text in the image (even if it's in speech bubbles). Then translate it into fluent Persian (فارسی). Return the output in this exact format:

          ORIGINAL:
          [Original text here]

          TRANSLATION:
          [Persian translation here]
          """

          token = os.environ["GITHUB_TOKEN"]
          payload = {
              "model": "gpt-4o-mini",
              "messages": [
                  {
                      "role": "user",
                      "content": [
                          {"type": "text", "text": prompt},
                          {"type": "image_url", "image_url": {"url": image_url}}
                      ]
                  }
              ],
              "max_tokens": 1500
          }

          print("🤖 Sending image to GPT-4o-mini for OCR + Translation...")
          resp = requests.post(
              "https://models.inference.ai.azure.com/chat/completions",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              },
              json=payload,
              timeout=60
          )

          if resp.status_code == 200:
              answer = resp.json()["choices"][0]["message"]["content"]
              print("✅ Model output:")
              print(answer)
              
              # Split original and translation
              if "ORIGINAL:" in answer and "TRANSLATION:" in answer:
                  original = answer.split("ORIGINAL:")[1].split("TRANSLATION:")[0].strip()
                  translation = answer.split("TRANSLATION:")[1].strip()
              else:
                  original = answer
                  translation = ""
              
              with open("manhwa/text_original.txt", "w", encoding="utf-8") as f:
                  f.write(original)
              with open("manhwa/text_translated.txt", "w", encoding="utf-8") as f:
                  f.write(translation)
              print("📝 Saved original and translation")
          else:
              print(f"❌ Error: {resp.status_code}")
              print(resp.text[:500])
              open("manhwa/text_original.txt", "w").write("OCR failed")
              open("manhwa/text_translated.txt", "w").write("Translation failed")
          EOF

      - name: Step 2 - WAN Inpainting
        run: |
          python3 << 'EOF'
          from gradio_client import Client, file
          print("🖼️ Calling WAN Inpainting Space...")
          client = Client("https://instantx-qwen-image-controlnet-inpainting.hf.space/")
          result = client.predict(
              image=file("manhwa/original.jpg"),
              prompt="Remove all text and speech bubbles, clean manga panel, high quality inpainting",
              api_name="/predict"
          )
          if isinstance(result, str):
              import shutil
              shutil.copy(result, "manhwa/cleaned.jpg")
              print("✅ Inpainting saved")
          elif isinstance(result, dict) and "image" in result:
              import shutil
              shutil.copy(result["image"], "manhwa/cleaned.jpg")
              print("✅ Inpainting saved")
          else:
              print(f"⚠️ Unexpected WAN result: {type(result)}")
          EOF

      - name: Save Results
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M)
          FOLDER="manhwa-results/${TIMESTAMP}"
          mkdir -p "$FOLDER"
          cp manhwa/original.jpg "$FOLDER/01_original.jpg" 2>/dev/null || true
          cp manhwa/cleaned.jpg "$FOLDER/02_cleaned.jpg" 2>/dev/null || true
          cp manhwa/text_original.txt "$FOLDER/03_original.txt" 2>/dev/null || true
          cp manhwa/text_translated.txt "$FOLDER/04_translated.txt" 2>/dev/null || true
          echo "✅ Results saved to $FOLDER"

      - name: Commit
        run: |
          git config user.name "ManhwaBot"
          git config user.email "bot@manhwa"
          git add manhwa-results/
          git commit -m "📖 Manhwa Vision AI $(date +%Y%m%d_%H%M)" || echo "Nothing to commit"
          git push || true
