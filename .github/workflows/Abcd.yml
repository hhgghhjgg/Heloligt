name: Download CGTrader with Puppeteer

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: 'CGTrader model URL'
        required: true
        type: string
        default: 'https://www.cgtrader.com/3d-models/character/woman/anime-character-casual-female-sleeveless-c092f010-d071-4994-97d2-586d0f24542a'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm init -y && npm install puppeteer

      - name: Download Model via Puppeteer
        run: |
          node << 'NODEEOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');

          const MODEL_URL = '${{ github.event.inputs.model_url }}';
          const uid = MODEL_URL.split('-').pop().replace('/', '');

          (async () => {
            console.log('🚀 Launching browser...');
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });

            const page = await browser.newPage();

            // Capture download links
            const downloadLinks = [];

            await page.setRequestInterception(true);
            page.on('request', (req) => {
              const url = req.url();
              if (url.includes('download') || url.includes('.zip') || url.includes('.fbx') || url.includes('.obj') || url.includes('.glb')) {
                downloadLinks.push(url);
                console.log('  🔗 Captured:', url.substring(0, 120));
              }
              req.continue();
            });

            page.on('response', async (resp) => {
              const url = resp.url();
              const headers = resp.headers();
              const ct = headers['content-type'] || '';
              const cd = headers['content-disposition'] || '';
              
              if ((ct.includes('zip') || ct.includes('octet-stream') || cd.includes('attachment') || cd.includes('filename')) && resp.status() === 200) {
                console.log('  📥 Download response:', url.substring(0, 120));
                if (!downloadLinks.includes(url)) {
                  downloadLinks.push(url);
                }
              }
            });

            console.log('🌐 Opening page...');
            await page.goto(MODEL_URL, { waitUntil: 'networkidle2', timeout: 60000 });
            console.log('✅ Page loaded');

            // Try clicking download buttons
            const buttons = await page.$$('a, button');
            for (const btn of buttons) {
              const text = await page.evaluate(el => el.textContent, btn);
              const href = await page.evaluate(el => el.getAttribute('href'), btn);
              if (text && (text.includes('Download') || text.includes('FREE') || text.includes('Buy'))) {
                console.log('  🖱️ Clicking:', text.trim());
                try {
                  await btn.click();
                  await new Promise(r => setTimeout(r, 2000));
                } catch(e) {}
              }
              if (href && (href.includes('download') || href.includes('.zip') || href.includes('.fbx'))) {
                downloadLinks.push(href.startsWith('http') ? href : 'https://www.cgtrader.com' + href);
              }
            }

            // Wait for requests
            await new Promise(r => setTimeout(r, 3000));

            // Unique links
            const uniqueLinks = [...new Set(downloadLinks)];
            console.log(`\n🔗 Found ${uniqueLinks.length} download links`);

            // Create output folder
            const outDir = '3d-models';
            if (!fs.existsSync(outDir)) fs.mkdirSync(outDir, { recursive: true });

            let downloaded = false;

            const cookies = await page.cookies();
            const cookieStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');
            const ua = await page.evaluate(() => navigator.userAgent);

            for (const durl of uniqueLinks) {
              console.log(`📥 Trying: ${durl.substring(0, 120)}`);
              try {
                const downloadFile = (url) => new Promise((resolve, reject) => {
                  const protocol = url.startsWith('https') ? https : http;
                  protocol.get(url, { headers: { 'User-Agent': ua, 'Cookie': cookieStr } }, (res) => {
                    if (res.statusCode === 302 || res.statusCode === 301) {
                      console.log(`  🔄 Redirect to: ${res.headers.location}`);
                      return resolve(downloadFile(res.headers.location));
                    }
                    if (res.statusCode !== 200) return reject(new Error(`HTTP ${res.statusCode}`));

                    const cd = res.headers['content-disposition'] || '';
                    let fname = `model_${uid}.zip`;
                    const m = cd.match(/filename="?([^"]+)"?/);
                    if (m) fname = m[1];
                    fname = fname.replace(/[\\/*?:"<>|]/g, '_');

                    const fpath = path.join(outDir, fname);
                    const file = fs.createWriteStream(fpath);
                    res.pipe(file);
                    file.on('finish', () => {
                      const sz = fs.statSync(fpath).size;
                      console.log(`  ✅ Saved: ${fname} (${(sz/1024).toFixed(0)}KB)`);
                      file.close();
                      resolve(fname);
                    });
                    file.on('error', reject);
                  }).on('error', reject);
                });

                const fname = await downloadFile(durl);
                downloaded = true;
                break;
              } catch(e) {
                console.log(`  ❌ ${e.message}`);
              }
            }

            if (!downloaded) console.log('❌ Could not download any file.');
            await browser.close();
          })();
          NODEEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 3d-models/ 2>/dev/null || true
          git commit -m "📦 CGTrader model" || echo "Nothing"
          git pull --rebase && git push || true
