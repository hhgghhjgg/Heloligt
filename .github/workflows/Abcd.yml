name: دانلودر پورن هاب

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL of the video or playlist'
        required: true
        type: string
      output_folder:
        description: 'Folder where the video will be saved'
        required: false
        type: string
        default: 'downloads'
      quality:
        description: 'Video quality (yt-dlp format selector)'
        required: true
        type: string
        default: 'bestvideo[height<=240]+bestaudio/best[height<=240][ext=mp4]/best[height<=240]'
      sort_by:
        description: 'Sort order for playlists'
        required: false
        type: choice
        options:
          - 'none (default)'
          - 'newest first'
          - 'oldest first'
          - 'most viewed first'
          - 'top rated first'
          - 'longest first'
          - 'shortest first'
          - 'most liked first'
        default: 'none (default)'
      category_filter:
        description: 'Category / tag filter (e.g., big-ass, milf, etc.) – leave empty for none'
        required: false
        type: string
        default: ''
      start:
        description: 'Start from video # (for playlists)'
        required: false
        type: string
        default: '1'
      end:
        description: 'End at video # (for playlists)'
        required: false
        type: string
        default: '1'
      archive_name:
        description: 'Base name for the RAR archive (if file is split)'
        required: false
        type: string
        default: 'video'

permissions:
  contents: write

jobs:
  download-and-maybe-split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp and bc
        run: |
          pip install yt-dlp
          sudo apt-get update && sudo apt-get install -y bc

      - name: Download video(s) with playlist support (retry up to 5 times)
        id: download
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          mkdir -p "$FOLDER"
          touch marker

          # Build sort argument
          SORT_ARG=""
          case "${{ github.event.inputs.sort_by }}" in
            "newest first")      SORT_ARG="--playlist-reverse" ;;
            "oldest first")      SORT_ARG="" ;;
            "most viewed first") SORT_ARG="--playlist-sort=view_count" ;;
            "top rated first")   SORT_ARG="--playlist-sort=rating:desc" ;;
            "longest first")     SORT_ARG="--playlist-sort=duration:desc" ;;
            "shortest first")    SORT_ARG="--playlist-sort=duration:asc" ;;
            "most liked first")  SORT_ARG="--playlist-sort=like_count:desc" ;;
            *)                   SORT_ARG="" ;;
          esac

          # Build match filter for category/tag
          MATCH_ARG=""
          if [ -n "${{ github.event.inputs.category_filter }}" ]; then
            MATCH_ARG='--match-filter "tags ~* ${{ github.event.inputs.category_filter }} || categories ~* ${{ github.event.inputs.category_filter }} || title ~* ${{ github.event.inputs.category_filter }}"'
          fi

          MAX_RETRIES=5
          RETRY_COUNT=0
          SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Download attempt $((RETRY_COUNT+1))/$MAX_RETRIES"
            yt-dlp \
              --output "./$FOLDER/%(playlist_index)s - %(uploader)s - %(title)s - %(id)s.%(ext)s" \
              --format "${{ github.event.inputs.quality }}" \
              --merge-output-format mp4 \
              --playlist-start "${{ github.event.inputs.start }}" \
              --playlist-end "${{ github.event.inputs.end }}" \
              $SORT_ARG \
              $MATCH_ARG \
              --retries 3 \
              --fragment-retries 10 \
              --no-check-certificate \
              --geo-bypass \
              --no-color \
              --ignore-errors \
              --newline \
              "${{ github.event.inputs.url }}" && {
                NEW_FILE=$(find "$FOLDER" -type f -newer marker -print -quit)
                if [ -n "$NEW_FILE" ]; then
                  echo "Download succeeded: $NEW_FILE"
                  SUCCESS=true
                  break
                else
                  echo "The download command exited with code 0, but no new file was found. Retrying..."
                fi
              } || {
                echo "Download attempt failed with exit code $?"
              }
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
              echo "Waiting 5 seconds before next attempt..."
              sleep 5
            fi
          done

          if [ "$SUCCESS" = false ]; then
            echo "Error: All $MAX_RETRIES download attempts failed."
            exit 1
          fi

          echo "All downloaded files:"
          find "$FOLDER" -type f -newer marker | while read -r FILE; do
            FILENAME=$(basename "$FILE")
            SIZE_BYTES=$(stat -c %s "$FILE")
            echo "  $FILENAME (${SIZE_BYTES} bytes)"
            echo "file_${FILENAME}=$FILENAME" >> /tmp/files.txt
          done
        shell: bash

      - name: Install RAR
        run: sudo apt-get install -y rar

      - name: Conditional split (if any file > 99 MB)
        id: split
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          THRESHOLD_MB=99

          cd "$FOLDER"

          find . -maxdepth 1 -type f | while read -r FILE; do
            FILENAME=$(basename "$FILE")
            SIZE_BYTES=$(stat -c %s "$FILE")
            SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)

            if (( $(echo "$SIZE_MB > $THRESHOLD_MB" | bc -l) )); then
              echo "File '${FILENAME}' size ${SIZE_MB} MB exceeds ${THRESHOLD_MB} MB – splitting into 95 MB RAR parts."
              RANDOM_HEX=$(openssl rand -hex 3)
              ARCHIVE_NAME="${FILENAME%.*}_${RANDOM_HEX}"
              rar a -v95m -m5 -ep1 "${ARCHIVE_NAME}.rar" "$FILENAME"
              rm "$FILENAME"
              echo "Split completed for ${FILENAME}. Parts:"
              ls -lh "${ARCHIVE_NAME}.part"*.rar
            else
              echo "File '${FILENAME}' size ${SIZE_MB} MB is ≤${THRESHOLD_MB} MB – keeping original file."
            fi
          done

      - name: Commit and push to repository
        run: |
          FOLDER="${{ github.event.inputs.output_folder }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FOLDER/"
          git commit -m "Downloaded videos from playlist" || echo "No changes to commit"
          git push
