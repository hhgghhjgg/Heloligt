name: Download 3D Models from Open3DModel

on:
  workflow_dispatch:
    inputs:
      page_url:
        description: 'URL of the page'
        required: true
        default: 'https://open3dmodel.com/3d-models/anime'
      max_models:
        description: 'Max models to download'
        required: false
        default: '3'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install requests beautifulsoup4

      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s http://localhost:8191/v1 | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then
              echo "✅ FlareSolverr ready"
              break
            fi
            sleep 4
          done

      - name: Download Models
        run: |
          python3 << 'PYEOF'
          import requests, os, re, sys, time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          page_url = "${{ inputs.page_url }}"
          max_models = int("${{ inputs.max_models }}")
          FLARE_URL = "http://localhost:8191/v1"

          def fetch_page(url):
              r = requests.post(FLARE_URL, json={"cmd": "request.get", "url": url, "maxTimeout": 60000}, timeout=120)
              data = r.json()
              if data.get("status") == "ok":
                  return data["solution"]["response"]
              return None

          def extract_download_links(html, base_url):
              soup = BeautifulSoup(html, "html.parser")
              links = set()
              extensions = ['.zip', '.rar', '.7z', '.fbx', '.obj', '.glb', '.gltf', '.stl', '.blend', '.max', '.c4d', '.ma', '.mb']
              for a in soup.find_all("a", href=True):
                  full = urljoin(base_url, a["href"])
                  path = urlparse(full).path.lower()
                  if any(path.endswith(ext) for ext in extensions) or 'download' in a["href"].lower():
                      links.add(full)
              return list(links)

          print(f"🌐 Page: {page_url}")
          html = fetch_page(page_url)
          if not html:
              print("❌ Failed"); sys.exit(1)
          print(f"✅ Loaded ({len(html)} bytes)")

          soup = BeautifulSoup(html, "html.parser")
          all_links = set()
          for a in soup.find_all("a", href=True):
              all_links.add(urljoin(page_url, a["href"]))

          # Find model pages (with .html or /3d-model/ or /3d-models/)
          model_pages = set()
          for link in all_links:
              low = link.lower()
              if '.html' in low or '/3d-model/' in low or '/3d-models/' in low:
                  # But exclude pagination, categories, submit, announcement
                  if not any(kw in low for kw in ['/page/', '/submit/', '/announcement/', '/lamp', '/desk', '/home-furniture']):
                      model_pages.add(link)

          print(f"📄 Found {len(model_pages)} model pages")

          download_urls = set()

          for model_url in list(model_pages)[:max_models*2]:
              if len(download_urls) >= max_models:
                  break
              print(f"  ➡️ {model_url.split('/')[-1][:60]}")
              m_html = fetch_page(model_url)
              if m_html:
                  dlinks = extract_download_links(m_html, model_url)
                  for dl in dlinks:
                      download_urls.add(dl)
              time.sleep(2)

          download_urls = list(download_urls)[:max_models]
          print(f"📥 {len(download_urls)} download links")

          if not download_urls:
              print("❌ No links found"); sys.exit(0)

          os.makedirs("3d-models", exist_ok=True)
          for idx, durl in enumerate(download_urls):
              print(f"  [{idx+1}] {durl[:100]}")
              try:
                  resp = requests.get(durl, headers={"User-Agent": "Mozilla/5.0"}, timeout=120, stream=True)
                  if resp.status_code == 200:
                      cd = resp.headers.get("Content-Disposition", "")
                      fname = re.search(r'filename="?([^";\s]+)"?', cd)
                      fname = fname.group(1) if fname else os.path.basename(urlparse(durl).path) or f"model_{idx+1}.zip"
                      fname = re.sub(r'[\\/*?:"<>|]', '_', fname)
                      fpath = os.path.join("3d-models", fname)
                      with open(fpath, "wb") as f:
                          for chunk in resp.iter_content(8192): f.write(chunk)
                      print(f"    ✅ {fname} ({os.path.getsize(fpath)//1024}KB)")
                  else:
                      print(f"    ❌ HTTP {resp.status_code}")
              except Exception as e:
                  print(f"    ❌ {e}")

          print("✅ Done!")
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 3d-models/ 2>/dev/null || true
          git commit -m "📦 3D models from Open3DModel" || echo "Nothing"
          git pull --rebase && git push || true
