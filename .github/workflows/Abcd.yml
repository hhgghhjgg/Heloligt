name: GitHub Models AI Assistant

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'سوال خود را بنویسید'
        required: true
        default: 'یک شعر کوتاه به فارسی بگو'

permissions:
  id-token: write
  contents: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Install LLM
        run: pip install -q llm llm-github-models

      - name: Ask AI
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📝 سوال: $PROMPT"
          echo "---"
          for MODEL in "gpt-4o" "DeepSeek-R1" "Phi-4" "Llama-4-Maverick-17B-128E-Instruct-FP8"; do
            echo "🔄 Trying: $MODEL"
            if llm prompt -m "github/${MODEL}" --key "$GITHUB_TOKEN" "$PROMPT" 2>/dev/null; then
              echo "✅ Success with $MODEL"
              break
            fi
            echo "❌ $MODEL failed, trying next..."
          done
          echo "---"
