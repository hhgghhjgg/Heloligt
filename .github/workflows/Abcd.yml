name: Build Latest React (UMD) + Save Failure Logs

on:
  workflow_dispatch:          # اجرای دستی
  schedule:
    - cron: '0 6 * * 1'      # هر دوشنبه ساعت ۶ صبح UTC

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # برای push کردن
      actions: read          # برای دریافت لاگ‌ها از API

    steps:
      # 1. Checkout ریپازیتوری خودت
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. آخرین tag پایدار ری‌اکت را از API دریافت کن
      - name: Get latest React release tag
        id: react_tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/facebook/react/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest React tag: $TAG"

      # 3. Checkout مخزن اصلی ری‌اکت در همان tag
      - name: Checkout facebook/react at latest tag
        uses: actions/checkout@v4
        with:
          repository: facebook/react
          ref: ${{ steps.react_tag.outputs.tag }}
          path: react-src

      # 4. نصب Node مطابق با نیاز ری‌اکت
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'react-src/.nvmrc'
          cache: 'yarn'
          cache-dependency-path: react-src/yarn.lock

      # 5. نصب وابستگی‌ها و build باندل‌های UMD
      - name: Install dependencies and build UMD bundles
        id: build
        run: |
          cd react-src
          yarn install --frozen-lockfile
          yarn build -- --type=UMD_DEV,UMD_PROD react/index react-dom/index
        env:
          CI: true

      # 6. در صورت موفقیت، فایل‌های ساخته شده را به mine/ منتقل کن
      - name: Copy built files to mine/ (only on success)
        if: success()
        run: |
          mkdir -p mine
          cp react-src/build/node_modules/react/umd/*.js mine/
          cp react-src/build/node_modules/react-dom/umd/*.js mine/
          echo "Built files:"
          ls -l mine/

      # 7. در صورت شکست (هر مرحله‌ای)، لاگ‌های Job را دریافت و در mine/logs/ ذخیره کن
      - name: Save failure logs
        if: failure()
        run: |
          echo "Job failed. Fetching logs for run ${{ github.run_id }}..."
          # دریافت ID مربوط به این Job (چون فقط یک Job داریم، اولین مورد کافیست)
          JOBS_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs")
          JOB_ID=$(echo "$JOBS_RESPONSE" | jq -r '.jobs[0].id')
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "ERROR: Could not determine job ID. API response:"
            echo "$JOBS_RESPONSE"
            exit 1
          fi
          echo "Job ID: $JOB_ID"

          # دانلود لاگ‌ها (یک فایل zip)
          mkdir -p mine/logs
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/jobs/$JOB_ID/logs" \
            -o mine/logs/job-logs.zip

          # استخراج محتویات zip (فایل‌های متنی لاگ هر مرحله)
          unzip -o mine/logs/job-logs.zip -d mine/logs/
          rm mine/logs/job-logs.zip

          echo "Logs saved to mine/logs/:"
          ls -l mine/logs/

      # 8. در هر حالتی (موفق یا شکست) تغییرات mine/ را commit و push کن
      - name: Commit and push any changes (built files or failure logs)
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mine/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            # انتخاب پیام commit مناسب
            if [ -d mine/logs ]; then
              COMMIT_MSG="Add failure logs for run ${{ github.run_id }}"
            else
              COMMIT_MSG="Update React UMD bundles to ${{ steps.react_tag.outputs.tag }}"
            fi
            git commit -m "$COMMIT_MSG"
            git push
          fi