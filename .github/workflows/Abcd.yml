name: Build Latest React UMD + Self-Logging

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Start logging
        id: logging
        run: |
          mkdir -p mine/logs
          echo "=== Workflow Started at $(date -u) ===" > mine/logs/full-log.txt
          echo "Run ID: ${{ github.run_id }}" >> mine/logs/full-log.txt
          echo "Run Number: ${{ github.run_number }}" >> mine/logs/full-log.txt
          echo "" >> mine/logs/full-log.txt

      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log checkpoint
        run: |
          echo "[$(date -u)] ✅ Repository checked out" >> mine/logs/full-log.txt

      - name: Get latest React release tag
        id: react_tag
        run: |
          {
            echo "[$(date -u)] Fetching latest React tag..."
            TAG=$(curl -s https://api.github.com/repos/facebook/react/releases/latest | jq -r .tag_name)
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "Latest React tag: $TAG"
            echo "[$(date -u)] ✅ Latest tag: $TAG" >> mine/logs/full-log.txt
          } 2>&1 | tee -a mine/logs/full-log.txt

      - name: Checkout facebook/react
        uses: actions/checkout@v4
        with:
          repository: facebook/react
          ref: ${{ steps.react_tag.outputs.tag }}
          path: react-src

      - name: Log checkpoint
        run: |
          echo "[$(date -u)] ✅ React source checked out at ${{ steps.react_tag.outputs.tag }}" >> mine/logs/full-log.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: react-src/yarn.lock

      - name: Log checkpoint
        run: |
          echo "[$(date -u)] ✅ Node.js $(node -v) ready" >> mine/logs/full-log.txt

      - name: Install dependencies
        id: install
        run: |
          {
            echo "[$(date -u)] Installing dependencies..."
            cd react-src
            yarn install --frozen-lockfile 2>&1
            echo "[$(date -u)] ✅ Dependencies installed"
          } 2>&1 | tee -a mine/logs/full-log.txt

      - name: Build React UMD
        id: build
        run: |
          {
            echo "[$(date -u)] Starting UMD build..."
            cd react-src
            
            # Build با خروجی کامل
            yarn build react/index,react-dom/index --type=UMD 2>&1
            
            echo "[$(date -u)] Build command completed"
            
            # چک کردن خروجی
            echo "" 
            echo "=== Checking output directories ==="
            ls -la build/node_modules/react/umd/ 2>&1 || echo "React UMD dir not found"
            ls -la build/node_modules/react-dom/umd/ 2>&1 || echo "React-DOM UMD dir not found"
            
            # جستجوی فایل‌های UMD
            echo ""
            echo "=== Searching for UMD files ==="
            find build -name "*.umd.js" -o -name "react.development.js" -o -name "react.production.min.js" 2>&1
            
            echo "[$(date -u)] ✅ Build completed"
          } 2>&1 | tee -a mine/logs/full-log.txt

      - name: Copy UMD files
        id: copy
        run: |
          {
            echo "[$(date -u)] Copying UMD files..."
            
            # کپی فایل‌های React
            if [ -d "react-src/build/node_modules/react/umd/" ]; then
              cp -v react-src/build/node_modules/react/umd/*.js mine/ 2>&1
              echo "✅ React files copied"
            fi
            
            # کپی فایل‌های React-DOM
            if [ -d "react-src/build/node_modules/react-dom/umd/" ]; then
              cp -v react-src/build/node_modules/react-dom/umd/*.js mine/ 2>&1
              echo "✅ React-DOM files copied"
            fi
            
            # نمایش فایل‌های نهایی
            echo ""
            echo "=== Files in mine/ ==="
            ls -la mine/
            
            echo "[$(date -u)] ✅ Copy completed"
          } 2>&1 | tee -a mine/logs/full-log.txt

      - name: Write failure info
        if: failure()
        run: |
          {
            echo ""
            echo "========================================="
            echo "           ❌ JOB FAILED"
            echo "========================================="
            echo "Timestamp: $(date -u)"
            echo "React Tag: ${{ steps.react_tag.outputs.tag }}"
            echo ""
            echo "Failed Steps:"
            
            if [ "${{ steps.install.outcome }}" = "failure" ]; then
              echo "  - Install dependencies: FAILED"
            fi
            
            if [ "${{ steps.build.outcome }}" = "failure" ]; then
              echo "  - Build: FAILED"
            fi
            
            if [ "${{ steps.copy.outcome }}" = "failure" ]; then
              echo "  - Copy files: FAILED"
            fi
            
            echo ""
            echo "========================================="
          } >> mine/logs/full-log.txt

      - name: Write success info
        if: success()
        run: |
          {
            echo ""
            echo "========================================="
            echo "           ✅ JOB SUCCEEDED"
            echo "========================================="
            echo "Timestamp: $(date -u)"
            echo "React Tag: ${{ steps.react_tag.outputs.tag }}"
            echo "========================================="
          } >> mine/logs/full-log.txt

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mine/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            if grep -q "JOB FAILED" mine/logs/full-log.txt 2>/dev/null; then
              COMMIT_MSG="📝 Save failure logs - Run #${{ github.run_number }}"
            else
              COMMIT_MSG="⬆️ Update React UMD to ${{ steps.react_tag.outputs.tag }}"
            fi
            git commit -m "$COMMIT_MSG"
            git push
            echo "✅ Changes pushed"
          fi