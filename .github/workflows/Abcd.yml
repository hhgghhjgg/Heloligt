name: Test manhwaus with Clean IP

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test manhwaus with Clean Cloudflare IP
        run: |
          CLEAN_IP="162.159.192.1"
          
          echo "📡 Testing manhwaus.org with Clean IP: $CLEAN_IP"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --resolve "manhwaus.org:443:$CLEAN_IP" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --connect-timeout 15 --max-time 30 \
            "https://manhwaus.org" 2>&1)
          
          echo "HTTP Status: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ manhwaus باز شد!"
          elif [ "$RESPONSE" = "403" ]; then
            echo "❌ هنوز بسته‌ست"
          else
            echo "⚠️ کد: $RESPONSE"
          fi
