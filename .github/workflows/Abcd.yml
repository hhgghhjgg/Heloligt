name: Browser Stream via Log Bridge

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'آدرس سایت پیش‌فرض'
        required: false
        default: 'https://wikipedia.org'

permissions:
  contents: write

jobs:
  browser-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm init -y && npm install puppeteer ws

      - name: Start Browser and WebSocket Bridge
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          cat > bridge.js << 'EOF'
          const puppeteer = require('puppeteer');
          const WebSocket = require('ws');

          const TARGET = process.env.TARGET_URL || 'https://wikipedia.org';

          (async () => {
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.goto(TARGET, { waitUntil: 'networkidle2' });

            // WebSocket server on localhost
            const wss = new WebSocket.Server({ port: 8080 });
            
            wss.on('connection', (ws) => {
              ws.on('message', async (msg) => {
                const cmd = msg.toString().trim();
                
                if (cmd.startsWith('NAVIGATE ')) {
                  const url = cmd.replace('NAVIGATE ', '');
                  await page.goto(url, { waitUntil: 'networkidle2' });
                  console.log(`BRIDGE_RESULT:NAVIGATED:${url}`);
                  ws.send('OK');
                } else if (cmd === 'SCREENSHOT') {
                  const shot = await page.screenshot({ encoding: 'base64' });
                  console.log(`BRIDGE_RESULT:SCREENSHOT:${shot}`);
                  ws.send('OK');
                } else if (cmd === 'HTML') {
                  const html = await page.content();
                  const b64 = Buffer.from(html).toString('base64');
                  console.log(`BRIDGE_RESULT:HTML:${b64}`);
                  ws.send('OK');
                }
              });
            });

            console.log('BRIDGE_READY');
            process.stdin.resume();
          })();
          EOF
          node bridge.js

      - name: Keep alive
        run: sleep 21600
