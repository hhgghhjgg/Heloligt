name: List GitHub Models

on:
  workflow_dispatch:  # برای اجرای دستی

permissions:
  contents: write

jobs:
  list-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install GitHub CLI (gh)
        run: |
          type -p curl >/dev/null || (sudo apt update && sudo apt install curl -y)
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      # --- 1. فهرست کامل از طریق GitHub CLI ---
      - name: Get model list via GitHub Models CLI
        run: |
          echo "# 📋 Full Model List (via 'gh models list')" > model-list-full.txt
          echo '```' >> model-list-full.txt
          gh models list >> model-list-full.txt 2>&1
          echo '```' >> model-list-full.txt
          echo "" >> model-list-full.txt

      # --- 2. فهرست کامل از طریق direct API call (backup) ---
      - name: Get model list via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🔍 Alternative Model List (via API)" >> model-list-full.txt
          echo '```json' >> model-list-full.txt
          curl -L -H "Accept: application/vnd.github+json" \
               -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "X-GitHub-Api-Version: 2026-03-10" \
               https://models.github.ai/catalog/models >> model-list-full.txt 2>&1
          echo '```' >> model-list-full.txt

      # --- 3. فهرست اختصاصی Gemini از یک منبع ثانویه ---
      - name: Get Gemini models from community repo
        run: |
          echo "## 🧠 Gemini Models from External Source" >> model-list-full.txt
          echo '```' >> model-list-full.txt
          curl -s "https://raw.githubusercontent.com/spullara/models/master/models.json" | jq -r '.gemini[]' 2>/dev/null >> model-list-full.txt || echo "Could not fetch secondary list." >> model-list-full.txt
          echo '```' >> model-list-full.txt

      - name: Commit and push the list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add model-list-full.txt
          git commit -m "Add full list of available models" || echo "No changes to commit"
          git push