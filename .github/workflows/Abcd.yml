name: Manhwa OCR + Translate + Qwen Alibaba Inpaint

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'آدرس عکس مانهوا (Raw URL)'
        required: true

permissions:
  models: read
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: pip install -q requests pillow gradio_client

      - name: Download & Validate Image
        run: |
          mkdir -p manhwa
          URL="${{ github.event.inputs.image_url }}"
          URL=$(echo "$URL" | sed 's|github.com/.*/blob/|raw.githubusercontent.com/|' | sed 's|/blob/|/|')
          echo "📥 Downloading: $URL"
          curl -L -o manhwa/original.jpg "$URL"
          python3 -c "
          from PIL import Image
          img = Image.open('manhwa/original.jpg')
          print(f'✅ Image loaded: {img.size}, {img.format}')
          "

      - name: Step 1 - OCR & Translate with GitHub Models Vision
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests, base64, os

          with open("manhwa/original.jpg", "rb") as f:
              img_bytes = f.read()
          img_b64 = base64.b64encode(img_bytes).decode("utf-8")

          prompt = """Read all text in this manhwa image (even in speech bubbles). Translate it into fluent Persian (فارسی). Return in this exact format:

          ORIGINAL:
          [Original text here]

          TRANSLATION:
          [Persian translation here]"""

          token = os.environ["GITHUB_TOKEN"]
          resp = requests.post(
              "https://models.inference.ai.azure.com/chat/completions",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              json={
                  "model": "gpt-4o-mini",
                  "messages": [{"role": "user", "content": [
                      {"type": "text", "text": prompt},
                      {"type": "image_url", "image_url": {"url": f"data:image/jpeg;base64,{img_b64}"}}
                  ]}],
                  "max_tokens": 1500
              }, timeout=60
          )

          if resp.status_code == 200:
              answer = resp.json()["choices"][0]["message"]["content"]
              print(f"✅ Model output:\n{answer}")
              original = answer.split("ORIGINAL:")[1].split("TRANSLATION:")[0].strip() if "TRANSLATION:" in answer else answer
              translation = answer.split("TRANSLATION:")[1].strip() if "TRANSLATION:" in answer else ""
              with open("manhwa/text_original.txt", "w", encoding="utf-8") as f: f.write(original)
              with open("manhwa/text_translated.txt", "w", encoding="utf-8") as f: f.write(translation)
          else:
              print(f"❌ Error: {resp.status_code} - {resp.text[:300]}")
              open("manhwa/text_original.txt", "w").write("OCR failed")
              open("manhwa/text_translated.txt", "w").write("Translation failed")
          EOF

      - name: Step 2 - Inpainting with Qwen-Image-Edit Space
        run: |
          python3 << 'EOF'
          from gradio_client import Client, file

          print("🖼️ Calling Qwen-Image-Edit Space...")
          client = Client("https://qwen-qwen-image-edit-2511.hf.space/")
          result = client.predict(
              image=file("manhwa/original.jpg"),
              prompt="Remove all text and speech bubbles, clean manga panel, high quality inpainting",
              api_name="/predict"
          )
          
          import shutil
          if isinstance(result, str):
              shutil.copy(result, "manhwa/cleaned.jpg")
          elif isinstance(result, dict) and "image" in result:
              shutil.copy(result["image"], "manhwa/cleaned.jpg")
          else:
              print(f"⚠️ Unexpected result: {type(result)}")
          print("✅ Inpainting Done")
          EOF

      - name: Save Results
        run: |
          FOLDER="manhwa-results/$(date +%Y%m%d_%H%M)"
          mkdir -p "$FOLDER"
          cp manhwa/original.jpg "$FOLDER/01_original.jpg"
          cp manhwa/cleaned.jpg "$FOLDER/02_cleaned.jpg" 2>/dev/null || true
          cp manhwa/text_original.txt "$FOLDER/03_original.txt"
          cp manhwa/text_translated.txt "$FOLDER/04_translated.txt"
          echo "✅ Saved to $FOLDER"

      - name: Commit
        run: |
          git config user.name "ManhwaBot"
          git config user.email "bot@manhwa"
          git add manhwa-results/
          git commit -m "📖 Manhwa Translation $(date +%H:%M)" || echo "Nothing to commit"
          git push || true
