name: VLESS XHTTP Simple

on:
  workflow_dispatch:

jobs:
  vless:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Setup Xray (VLESS + XHTTP)
        run: |
          # 1. Download Xray-core
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip xray.zip -d xray
          chmod +x xray/xray
          
          # 2. Generate UUID
          UUID=$(cat /proc/sys/kernel/random/uuid)
          echo "UUID: $UUID"
          
          # 3. Create config
          cat > xray/config.json << 'XRAYEOF'
          {
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "port": 8080,
              "listen": "0.0.0.0",
              "protocol": "vless",
              "settings": {
                "clients": [{
                  "id": "PLACEHOLDER_UUID"
                }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "xhttp",
                "xhttpSettings": {
                  "path": "/"
                }
              }
            }],
            "outbounds": [{
              "protocol": "freedom",
              "settings": {}
            }]
          }
          XRAYEOF
          
          sed -i "s/PLACEHOLDER_UUID/$UUID/g" xray/config.json
          
          # 4. Start Xray
          cd xray && ./xray run -config config.json &
          sleep 2
          
          # 5. Show config
          PUBLIC_IP=$(curl -s https://api.ipify
