name: AI Inference with GitHub Models

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'سوال خود را بنویسید'
        required: true
        default: 'یک شعر کوتاه به فارسی بگو'
      model:
        description: 'مدل مورد نظر (حتماً پیشوندش رو بذار. مثلاً openai/gpt-4.1-mini)'
        required: false
        default: 'openai/gpt-4.1-mini'

permissions:
  models: read  # این خط طلاییه! بدون این، هیچی کار نمی‌کنه

jobs:
  ai-inference:
    runs-on: ubuntu-latest
    steps:
      - name: AI Inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: ${{ github.event.inputs.prompt }}
          model: ${{ github.event.inputs.model }}

      - name: Print AI Response
        id: output
        run: echo "${{ steps.inference.outputs.response }}"
