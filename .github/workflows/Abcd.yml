name: The Buster - Iran Network Scanner

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils curl jq

      - name: Scan DNS
        run: |
          echo "=== DNS SCAN ==="
          mkdir -p scan-results
          
          # روش ساده بدون آرایه
          dig +time=3 +tries=1 @8.8.8.8 github.com 2>/dev/null | grep "Query time" && echo "DNS_OK|Google|8.8.8.8" >> scan-results/dns.log || echo "DNS_FAIL|Google|8.8.8.8" >> scan-results/dns.log
          dig +time=3 +tries=1 @1.1.1.1 github.com 2>/dev/null | grep "Query time" && echo "DNS_OK|Cloudflare|1.1.1.1" >> scan-results/dns.log || echo "DNS_FAIL|Cloudflare|1.1.1.1" >> scan-results/dns.log
          dig +time=3 +tries=1 @9.9.9.9 github.com 2>/dev/null | grep "Query time" && echo "DNS_OK|Quad9|9.9.9.9" >> scan-results/dns.log || echo "DNS_FAIL|Quad9|9.9.9.9" >> scan-results/dns.log
          dig +time=3 +tries=1 @178.22.122.100 github.com 2>/dev/null | grep "Query time" && echo "DNS_OK|Shecan|178.22.122.100" >> scan-results/dns.log || echo "DNS_FAIL|Shecan|178.22.122.100" >> scan-results/dns.log
          dig +time=3 +tries=1 @185.51.200.2 github.com 2>/dev/null | grep "Query time" && echo "DNS_OK|Electro|185.51.200.2" >> scan-results/dns.log || echo "DNS_FAIL|Electro|185.51.200.2" >> scan-results/dns.log
          dig +time=3 +tries=1 @10.202.10.10 github.com 2>/dev/null | grep "Query time" && echo "DNS_OK|403|10.202.10.10" >> scan-results/dns.log || echo "DNS_FAIL|403|10.202.10.10" >> scan-results/dns.log
          dig +time=3 +tries=1 @78.157.42.100 github.com 2>/dev/null | grep "Query time" && echo "DNS_OK|Radar|78.157.42.100" >> scan-results/dns.log || echo "DNS_FAIL|Radar|78.157.42.100" >> scan-results/dns.log
          dig +time=3 +tries=1 @208.67.222.222 github.com 2>/dev/null | grep "Query time" && echo "DNS_OK|OpenDNS|208.67.222.222" >> scan-results/dns.log || echo "DNS_FAIL|OpenDNS|208.67.222.222" >> scan-results/dns.log

      - name: Scan SNI
        run: |
          echo "=== SNI SCAN ==="
          for SNI in github.com cloudflare.com microsoft.com google.com arvancloud.com vercel.com telegram.org whatsapp.com youtube.com twitter.com; do
            if curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 "https://$SNI" 2>/dev/null | grep -q "200\|301\|302"; then
              echo "✅ $SNI"
              echo "SNI_OPEN|$SNI" >> scan-results/sni.log
            else
              echo "❌ $SNI"
              echo "SNI_BLOCKED|$SNI" >> scan-results/sni.log
            fi
          done

      - name: Scan Ports
        run: |
          echo "=== PORT SCAN ==="
          for TARGET in github.com cloudflare.com microsoft.com arvancloud.com; do
            for PORT in 80 443 8080 8443 2053 2096; do
              if timeout 2 bash -c "echo >/dev/tcp/$TARGET/$PORT" 2>/dev/null; then
                echo "✅ $TARGET:$PORT"
                echo "PORT_OPEN|$TARGET|$PORT" >> scan-results/ports.log
              fi
            done
          done

      - name: Runner Info
        run: |
          echo "=== RUNNER INFO ==="
          PUBLIC_IP=$(curl -s https://api.ipify.org)
          echo "IP: $PUBLIC_IP"
          curl -s "https://ipapi.co/$PUBLIC_IP/json/" | jq '{ip, city, country}'

      - name: Generate Report
        run: |
          mkdir -p buster-reports
          cat > "buster-reports/report_$(date +%Y%m%d_%H%M).md" << 'EOF'
          # 🕵️ Buster Report
          **Time:** $(date)
          **Runner IP:** $(curl -s https://api.ipify.org)
          
          ## DNS
          $(cat scan-results/dns.log 2>/dev/null | head -10)
          
          ## SNI
          $(cat scan-results/sni.log 2>/dev/null | head -15)
          
          ## Ports
          $(cat scan-results/ports.log 2>/dev/null | head -15)
          EOF

      - name: Commit
        run: |
          git config user.name "Buster"
          git config user.email "buster@bot"
          git add scan-results/ buster-reports/
          git commit -m "🕵️ Scan $(date +%H:%M)" || echo "Nothing"
          git push || true
