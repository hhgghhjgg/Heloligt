name: Build Latest React and Save to `mine/`

on:
  workflow_dispatch:          # دستی اجرا کنی
  schedule:
    - cron: '0 6 * * 1'      # هر دوشنبه ساعت ۶ صبح (UTC) چک کنه نسخه جدید اومده یا نه

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # اجازه push کردن
    steps:
      # 1. Checkout ریپازیتوری خودت
      - name: Checkout my repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. گرفتن آخرین tag پایدار از ریپوی اصلی React
      - name: Get latest React release tag
        id: react_tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/facebook/react/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Latest React tag: $TAG"

      # 3. Checkout مخزن رسمی React روی همون tag
      - name: Checkout facebook/react at latest tag
        uses: actions/checkout@v4
        with:
          repository: facebook/react
          ref: ${{ steps.react_tag.outputs.tag }}
          path: react-src          # تو یه پوشه جدا می‌ریزیمش

      # 4. نصب Node (همون ورژنی که ری‌اکت نیاز داره)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: 'react-src/.nvmrc'  # از فایل خود ری‌اکت میخونه
          cache: 'yarn'
          cache-dependency-path: react-src/yarn.lock

      # 5. نصب وابستگی‌ها و build کردن فقط react و react-dom به صورت UMD
      - name: Install dependencies and build UMD bundles
        run: |
          cd react-src
          yarn install --frozen-lockfile
          # فقط باندل‌های UMD مربوط به react و react-dom رو می‌سازیم
          yarn build -- --type=UMD_DEV,UMD_PROD react/index react-dom/index
        env:
          CI: true

      # 6. کپی فایل‌های بیلد شده به پوشه mine/
      - name: Copy built files to mine/
        run: |
          mkdir -p mine
          cp react-src/build/node_modules/react/umd/*.js mine/
          cp react-src/build/node_modules/react-dom/umd/*.js mine/
          # اگه build پوشه جدا داره، یه بار با 'ls' چک کن تا مطمئن شی
          ls -l mine/

      # 7. ثبت تغییرات و push به ریپوی خودت
      - name: Commit and push if changes exist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mine/
          # فقط اگه تغییری کرده باشه commit کنه
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update React UMD bundles to ${{ steps.react_tag.outputs.tag }}"
            git push
          fi