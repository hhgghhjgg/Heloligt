name: Manhwa OCR + Translate + WAN Inpaint

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'آدرس Raw عکس مانهوا'
        required: true
        default: 'https://raw.githubusercontent.com/hhgghhjgg/Heloligt/main/sites/manga/The%20Great%20Mage%20Of%20The%20Heros%20Party%20Reincarnates/chapter_1/2026-05-06_17-15/images/009.jpg'

permissions:
  models: read
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: pip install -q requests pillow manga-ocr torch torchvision gradio_client

      - name: Download & Validate Image
        run: |
          mkdir -p manhwa
          URL="${{ github.event.inputs.image_url }}"
          
          # تبدیل blob URL به raw URL
          URL=$(echo "$URL" | sed 's|github.com/.*/blob/|raw.githubusercontent.com/|' | sed 's|/blob/|/|')
          
          echo "📥 Downloading: $URL"
          curl -L -o manhwa/original.jpg "$URL"
          
          # اعتبارسنجی فایل
          python3 << 'EOF'
          from PIL import Image
          try:
              img = Image.open("manhwa/original.jpg")
              print(f"✅ Valid image: {img.size}, Format: {img.format}")
          except Exception as e:
              print(f"❌ Invalid image: {e}")
              exit(1)
          EOF

      # ============== OCR ==============
      - name: Step 1 - OCR
        run: |
          python3 << 'EOF'
          from manga_ocr import MangaOcr
          mocr = MangaOcr()
          text = mocr("manhwa/original.jpg")
          print(f"📝 OCR: {text}")
          open("manhwa/text_original.txt", "w", encoding="utf-8").write(text)
          EOF

      # ============== ترجمه ==============
      - name: Step 2 - Translate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests, os
          text = open("manhwa/text_original.txt").read()
          token = os.environ["GITHUB_TOKEN"]

          resp = requests.post(
              "https://models.inference.ai.azure.com/chat/completions",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
              json={
                  "model": "gpt-4o-mini",
                  "messages": [{"role": "user", "content": f"Translate this manhwa text to Persian (فارسی). Return ONLY the translation:\n\n{text}"}],
                  "max_tokens": 500
              },
              timeout=30
          )
          translated = resp.json()["choices"][0]["message"]["content"]
          print(f"📝 Translated: {translated}")
          open("manhwa/text_translated.txt", "w", encoding="utf-8").write(translated)
          EOF

      # ============== WAN Inpainting ==============
      - name: Step 3 - WAN Inpainting
        run: |
          python3 << 'EOF'
          from gradio_client import Client, file
          client = Client("https://instantx-qwen-image-controlnet-inpainting.hf.space/")
          result = client.predict(
              image=file("manhwa/original.jpg"),
              prompt="Remove all text and speech bubbles",
              api_name="/predict"
          )
          if isinstance(result, str):
              import shutil
              shutil.copy(result, "manhwa/cleaned.jpg")
          print("✅ Inpainting Done")
          EOF

      # ============== ذخیره ==============
      - name: Save Results
        run: |
          FOLDER="manhwa-results/$(date +%Y%m%d_%H%M)"
          mkdir -p "$FOLDER"
          cp manhwa/original.jpg "$FOLDER/01_original.jpg" 2>/dev/null || true
          cp manhwa/cleaned.jpg "$FOLDER/02_cleaned.jpg" 2>/dev/null || true
          cp manhwa/text_original.txt "$FOLDER/03_original.txt" 2>/dev/null || true
          cp manhwa/text_translated.txt "$FOLDER/04_translated.txt" 2>/dev/null || true

      - name: Commit
        run: |
          git config user.name "ManhwaBot"
          git config user.email "bot@manhwa"
          git add manhwa-results/
          git commit -m "📖 Translation $(date +%H:%M)" || echo "Nothing"
          git push || true
