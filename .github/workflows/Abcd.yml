name: GitHub Models AI Assistant

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'سوال خود را بنویسید'
        required: true
        default: 'یک شعر کوتاه به فارسی بگو'
      model:
        description: 'مدل مورد نظر'
        required: false
        default: 'gpt-4.1-mini'

permissions:
  id-token: write
  contents: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Install LLM and GitHub Models Plugin
        run: |
          pip install --upgrade pip
          pip install llm llm-github-models

      - name: Ask AI
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          MODEL: ${{ github.event.inputs.model }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📝 سوال: $PROMPT"
          echo "🤖 مدل: $MODEL"
          echo "---"
          llm prompt -m "github/${MODEL}" --key "$GITHUB_TOKEN" "$PROMPT" 2>&1 || \
          llm prompt -m "github/${MODEL}" -o key "$GITHUB_TOKEN" "$PROMPT"
          echo "---"
