name: Test manhwaus with Clean IP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test manhwaus with all Clean IPs
        run: |
          echo "🧪 Testing manhwaus.org with Clean Cloudflare IPs..."
          echo ""
          
          cat << 'EOF' > clean_ips.txt
          162.159.192.1
          162.159.193.1
          162.159.195.1
          162.159.204.1
          188.114.96.1
          188.114.97.1
          EOF
          
          > results.txt
          
          while IFS= read -r IP; do
            [ -z "$IP" ] && continue
            
            echo "🔹 Testing: $IP"
            
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
              -k \
              --resolve "manhwaus.org:443:$IP" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              --connect-timeout 10 --max-time 20 \
              "https://manhwaus.org" 2>/dev/null || echo "000")
            
            if [ "$HTTP" = "200" ]; then
              echo "  ✅ manhwaus باز شد! (HTTP $HTTP)"
              echo "$IP | HTTP:$HTTP | ✅ SUCCESS" >> results.txt
            elif [ "$HTTP" = "403" ]; then
              echo "  ❌ بسته‌ست (HTTP 403)"
              echo "$IP | HTTP:$HTTP | ❌ BLOCKED" >> results.txt
            elif [ "$HTTP" = "000" ]; then
              echo "  ⚠️ وصل نشد"
              echo "$IP | HTTP:$HTTP | ⚠️ NO CONNECTION" >> results.txt
            else
              echo "  ⚠️ HTTP $HTTP"
              echo "$IP | HTTP:$HTTP | ⚠️" >> results.txt
            fi
            
          done < clean_ips.txt
          
          echo ""
          echo "===== RESULTS ====="
          cat results.txt

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.txt clean_ips.txt 2>/dev/null || true
          git commit -m "🧪 manhwaus test with Clean IPs v2 | $(date '+%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git pull --rebase && git push || true
