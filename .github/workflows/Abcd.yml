name: Download CGTrader 3D Model

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: 'CGTrader model URL'
        required: true
        type: string
        default: 'https://www.cgtrader.com/3d-models/character/woman/anime-character-casual-female-sleeveless-c092f010-d071-4994-97d2-586d0f24542a'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s http://localhost:8191/v1 | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then echo "✅ Ready"; break; fi
            sleep 4
          done
      - name: Install Dependencies
        run: pip install requests beautifulsoup4
      - name: Download Model
        run: |
          python3 << 'PYEOF'
          import requests, re, os, json
          from bs4 import BeautifulSoup

          model_url = "${{ github.event.inputs.model_url }}"
          uid = model_url.rstrip("/").split("-")[-1]

          print(f"🕷️ Crawling: {model_url}")
          r = requests.post("http://localhost:8191/v1", json={
              "cmd": "request.get", "url": model_url, "maxTimeout": 90000
          }, timeout=120)
          d = r.json()
          if d.get("status") != "ok": print("❌ FlareSolverr failed"); exit(1)

          html = d["solution"]["response"]
          cookies = d["solution"].get("cookies", [])
          ua = d["solution"].get("userAgent", "")
          print(f"✅ Page: {len(html)} bytes, {len(cookies)} cookies")

          soup = BeautifulSoup(html, "html.parser")
          ses = requests.Session()
          ses.headers.update({"User-Agent": ua})
          for c in cookies: ses.cookies.set(c["name"], c["value"])

          # --- 1. Find download links in HTML ---
          download_urls = []
          for a in soup.find_all("a", href=True):
              href = a["href"]
              if any(x in href.lower() for x in [".fbx", ".obj", ".gltf", ".glb", ".blend", ".zip", "/download/"]):
                  if not href.startswith("http"): href = "https://www.cgtrader.com" + href
                  download_urls.append(href)
              # Capture inline schema
              if "download" in href.lower(): download_urls.append(href)

          # --- 2. Look inside JSON-LD / React hydration ---
          for script in soup.find_all("script"):
              if script.string and '"downloadUrl"' in script.string:
                  matches = re.findall(r'"downloadUrl"\s*:\s*"([^"]+)"', script.string)
                  download_urls.extend(matches)

          # --- 3. Try API guess ---
          api_guesses = [
              f"https://www.cgtrader.com/api/models/{uid}/download",
              f"https://api.cgtrader.com/v1/3d-models/{uid}/download"
          ]
          download_urls.extend(api_guesses)

          # --- 4. Try every found URL ---
          os.makedirs("3d-models", exist_ok=True)
          downloaded = False
          for idx, durl in enumerate(download_urls[:10]):
              if downloaded: break
              print(f"📥 [{idx+1}] Trying: {durl[:120]}")
              try:
                  dr = ses.get(durl, timeout=60, stream=True)
                  if dr.status_code == 200 and int(dr.headers.get("Content-Length", "0")) > 1000:
                      cd = dr.headers.get("Content-Disposition", "")
                      fname = f"model_{uid}.zip"
                      m = re.search(r'filename="?([^"]+)"?', cd)
                      if m: fname = m.group(1)
                      path = f"3d-models/{fname}"
                      with open(path, "wb") as f:
                          for chunk in dr.iter_content(8192): f.write(chunk)
                      print(f"  ✅ Saved: {fname} ({os.path.getsize(path)//1024}KB)")
                      downloaded = True
                  else:
                      print(f"  ⚠️ HTTP {dr.status_code} / size={dr.headers.get('Content-Length','?')}")
              except Exception as e:
                  print(f"  ❌ {str(e)[:60]}")

          if not downloaded:
              print("❌ Could not download any file.")
          else:
              print("✅ Done!")
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 3d-models/ 2>/dev/null || true
          git commit -m "📦 CGTrader model" || echo "Nothing"
          git pull --rebase && git push || true
