name: Generate 3D Character with CharacterGen

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Describe your character'
        required: true
        type: string
        default: 'A cute anime girl with long blue hair, wearing a school uniform, standing pose'
      texture_resolution:
        description: 'Texture resolution'
        required: false
        type: choice
        options:
          - '1024'
          - '2048'
          - '4096'
        default: '2048'
      output_format:
        description: 'Output format'
        required: false
        type: choice
        options:
          - 'glb'
          - 'obj'
          - 'fbx'
        default: 'glb'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests huggingface_hub gradio_client

      - name: Generate Character
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          TEX_RES: ${{ github.event.inputs.texture_resolution }}
          FORMAT: ${{ github.event.inputs.output_format }}
        run: |
          python3 << 'PYEOF'
          import requests, os, json, time, base64
          from gradio_client import Client

          prompt = os.environ["PROMPT"]
          tex_res = int(os.environ["TEX_RES"])
          fmt = os.environ["FORMAT"]

          print(f"🎨 Generating: {prompt}")
          print(f"📐 Texture: {tex_res}px, Format: {fmt}")

          # Use CharacterGen Space on Hugging Face
          space_url = "https://vast-ai-charactergen.hf.space/"

          try:
              client = Client(space_url)
              print(f"✅ Connected to CharacterGen")

              # Generate 3D model
              result = client.predict(
                  prompt=prompt,
                  texture_resolution=tex_res,
                  output_format=fmt,
                  api_name="/predict"
              )

              print(f"🔗 Result: {result}")

              # The result is usually a file path or dict
              out_dir = "generated-3d-models"
              os.makedirs(out_dir, exist_ok=True)

              if isinstance(result, str) and os.path.exists(result):
                  import shutil
                  fname = f"character.{fmt}"
                  shutil.copy(result, os.path.join(out_dir, fname))
                  print(f"✅ Saved: {fname}")
              elif isinstance(result, dict):
                  for key in ["result", "output", "file", "model"]:
                      if key in result:
                          path = result[key]
                          if isinstance(path, str):
                              if path.startswith("http"):
                                  # Download
                                  r = requests.get(path, timeout=60)
                                  fname = f"character.{fmt}"
                                  fpath = os.path.join(out_dir, fname)
                                  with open(fpath, "wb") as f:
                                      f.write(r.content)
                                  print(f"✅ Downloaded: {fname} ({len(r.content)//1024}KB)")
                              elif os.path.exists(path):
                                  import shutil
                                  shutil.copy(path, os.path.join(out_dir, f"character.{fmt}"))
                                  print(f"✅ Saved: character.{fmt}")
              else:
                  print(f"⚠️ Unexpected result type: {type(result)}")
                  print(f"  Raw: {str(result)[:500]}")

          except Exception as e:
              print(f"⚠️ Space failed: {str(e)[:100]}")
              print("🔄 Attempting API-only approach...")

              # Fallback: direct API call
              api_url = "https://api-inference.huggingface.co/models/VAST-AI/CharacterGen"
              headers = {"Authorization": "Bearer ${{ secrets.HF_TOKEN }}"}

              resp = requests.post(api_url, json={"inputs": prompt}, timeout=120)

              if resp.status_code == 200:
                  out_dir = "generated-3d-models"
                  os.makedirs(out_dir, exist_ok=True)
                  fname = f"character.{fmt}"
                  fpath = os.path.join(out_dir, fname)
                  with open(fpath, "wb") as f:
                      f.write(resp.content)
                  print(f"✅ Generated via API: {fname} ({len(resp.content)//1024}KB)")
              else:
                  print(f"❌ API failed: {resp.status_code}")
                  print(resp.text[:300])
          PYEOF

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated-3d-models/ 2>/dev/null || true
          git commit -m "🎨 Generated 3D character: ${{ github.event.inputs.prompt }}" || echo "Nothing"
          git pull --rebase && git push || true
