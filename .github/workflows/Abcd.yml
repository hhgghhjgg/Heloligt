name: GitHub Models AI Assistant

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'سوال خود را بنویسید'
        required: true
        default: 'یک شعر کوتاه به فارسی بگو'
      model:
        description: 'مدل مورد نظر'
        required: false
        default: 'gpt-4o-mini'

permissions:
  id-token: write
  contents: read

jobs:
  ask-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Install LLM and GitHub Models Plugin
        run: |
          pip install --upgrade pip -q
          pip install llm llm-github-models -q

      - name: Set GitHub Token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | llm keys set github-models

      - name: List Available Models
        run: |
          echo "🔍 مدل‌های موجود:"
          llm models | grep github || echo "No models listed yet"

      - name: Ask AI
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          MODEL: ${{ github.event.inputs.model }}
        run: |
          echo "📝 سوال: $PROMPT"
          echo "🤖 مدل: $MODEL"
          echo "---"
          llm prompt -m "github/${MODEL}" "$PROMPT" || \
          llm prompt -m "github/gpt-4o" "$PROMPT" || \
          llm prompt -m "github/gpt-4o-mini" "$PROMPT" || \
          llm prompt -m "github/Phi-3.5-mini-instruct" "$PROMPT"
          echo "---"
