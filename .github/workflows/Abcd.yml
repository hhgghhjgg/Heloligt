name: Create Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      space_name:
        description: 'اسم اسپیس'
        required: true
        type: string
      sdk:
        description: 'نوع SDK'
        required: true
        type: choice
        options:
          - gradio
          - streamlit
          - static
          - docker
        default: 'gradio'
      hardware:
        description: 'سخت‌افزار'
        required: true
        type: choice
        options:
          - cpu-basic
          - cpu-upgrade
          - t4-small
          - t4-medium
        default: 'cpu-basic'
      private:
        description: 'خصوصی؟'
        required: true
        type: boolean
        default: false

jobs:
  create-space:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت username
        id: whoami
        run: |
          USERNAME=$(curl -s -H "Authorization: Bearer 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" https://huggingface.co/api/whoami-v2 | jq -r '.name')
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "نام کاربری: $USERNAME"

      - name: ساخت اسپیس
        run: |
          curl -X POST "https://huggingface.co/api/repos/create" \
            -H "Authorization: Bearer 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" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "${{ github.event.inputs.space_name }}",
              "type": "space",
              "sdk": "${{ github.event.inputs.sdk }}",
              "hardware": "${{ github.event.inputs.hardware }}",
              "private": ${{ github.event.inputs.private }},
              "namespace": "${{ steps.whoami.outputs.username }}"
            }'

      - name: نتیجه
        run: |
          echo "✅ اسپیس ساخته شد:"
          echo "https://huggingface.co/spaces/${{ steps.whoami.outputs.username }}/${{ github.event.inputs.space_name }}"
