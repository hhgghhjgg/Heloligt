name: Download CGTrader 3D Model

on:
  workflow_dispatch:
    inputs:
      model_url:
        description: 'CGTrader model URL'
        required: true
        type: string
        default: 'https://www.cgtrader.com/3d-models/character/woman/anime-character-casual-female-sleeveless-c092f010-d071-4994-97d2-586d0f24542a'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s http://localhost:8191/v1 | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "ok" ]; then echo "✅ Ready"; break; fi
            sleep 4
          done
      - name: Install Dependencies
        run: pip install requests beautifulsoup4
      - name: Download Model
        run: |
          python3 << 'PYEOF'
          import requests, re, os, json
          from bs4 import BeautifulSoup

          model_url = "${{ github.event.inputs.model_url }}"
          uid = model_url.rstrip("/").split("-")[-1]

          print(f"🕷️ Crawling: {model_url}")
          r = requests.post("http://localhost:8191/v1", json={
              "cmd": "request.get", "url": model_url, "maxTimeout": 90000
          }, timeout=120)
          d = r.json()
          if d.get("status") != "ok": print("❌ FlareSolverr failed"); exit(1)

          html = d["solution"]["response"]
          cookies = d["solution"].get("cookies", [])
          ua = d["solution"].get("userAgent", "")

          ses = requests.Session()
          ses.headers.update({"User-Agent": ua})
          for c in cookies: ses.cookies.set(c["name"], c["value"])

          soup = BeautifulSoup(html, "html.parser")

          # ۱. پیدا کردن JSON-LD schema
          download_urls = []
          for script in soup.find_all("script", type="application/ld+json"):
              try:
                  data = json.loads(script.string)
                  if isinstance(data, dict) and "offers" in data:
                      offers = data["offers"] if isinstance(data["offers"], list) else [data["offers"]]
                      for offer in offers:
                          if "downloadUrl" in offer:
                              download_urls.append(offer["downloadUrl"])
                          if "url" in offer:
                              download_urls.append(offer["url"])
              except: pass

          # ۲. پیدا کردن همه لینک‌های دانلود از تگ‌های a
          for a in soup.find_all("a", href=True):
              href = a["href"]
              if any(x in href.lower() for x in [".fbx", ".obj", ".gltf", ".glb", ".blend", ".zip",
                  "/download/", "downloads", "files", "asset"]):
                  if not href.startswith("http"): href = "https://www.cgtrader.com" + href
                  download_urls.append(href)

          # ۳. جستجوی regex برای الگوهای دانلود
          patterns = [
              r'"downloadUrl"\s*:\s*"([^"]+)"',
              r'"file"\s*:\s*"([^"]+)"',
              r'"(https?://[^"]+\.(?:fbx|obj|gltf|glb|blend|zip|rar)[^"]*)"',
          ]
          for p in patterns:
              matches = re.findall(p, html)
              download_urls.extend(matches)

          os.makedirs("3d-models", exist_ok=True)
          downloaded = False

          # حذف تکراری‌ها
          download_urls = list(set(download_urls))
          print(f"🔗 Found {len(download_urls)} unique links")

          for idx, durl in enumerate(download_urls[:20]):
              print(f"📥 [{idx+1}] {durl[:150]}")
              try:
                  dr = ses.get(durl, timeout=60, stream=True)
                  ct = dr.headers.get("Content-Type", "")
                  cl = int(dr.headers.get("Content-Length", "0"))
                  
                  if dr.status_code == 200 and cl > 1000:
                      cd = dr.headers.get("Content-Disposition", "")
                      fname = f"model_{uid}_{idx}.zip"
                      m = re.search(r'filename="?([^"]+)"?', cd)
                      if m: fname = m.group(1)
                      fname = re.sub(r'[\\/*?:"<>|]', '_', fname)
                      
                      path = f"3d-models/{fname}"
                      with open(path, "wb") as f:
                          for chunk in dr.iter_content(8192): f.write(chunk)
                      print(f"  ✅ Saved: {fname} ({os.path.getsize(path)//1024}KB)")
                      downloaded = True
                      break
                  else:
                      print(f"  ⚠️ HTTP {dr.status_code}, size={cl}, type={ct[:50]}")
              except Exception as e:
                  print(f"  ❌ {str(e)[:60]}")

          if not downloaded:
              print("❌ Could not download any file.")
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 3d-models/ 2>/dev/null || true
          git commit -m "📦 CGTrader model" || echo "Nothing"
          git pull --rebase && git push || true
