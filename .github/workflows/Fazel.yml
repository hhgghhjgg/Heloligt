name: دانلود APK از APKCombo

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'نام پکیج (مثلاً com.deepseek.chat)'
        required: true
        type: string
        default: 'com.deepseek.chat'
      architecture:
        description: 'معماری پردازنده'
        required: true
        type: choice
        options:
          - universal
          - arm64-v8a
          - armeabi-v7a
        default: 'arm64-v8a'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @nirewen/apkcombo-downloader

      - name: Download APK
        env:
          PACKAGE: ${{ inputs.package_name }}
          ARCH: ${{ inputs.architecture }}
        run: |
          mkdir -p downloads
          node - << 'NODEEOF'
          const { APKComboDownloader } = require("@nirewen/apkcombo-downloader");
          
          (async () => {
            const apkcd = new APKComboDownloader({
              outDir: "./downloads",
              arch: process.env.ARCH
            });

            console.log(`Downloading ${process.env.PACKAGE} for ${process.env.ARCH}...`);
            
            await apkcd.download({
              org: "deepseek-ai-assistant",
              repo: process.env.PACKAGE
            });
            
            console.log("دانلود با موفقیت انجام شد!");
          })();
          NODEEOF

      - name: Compress and push APK
        run: |
          cd downloads
          mkdir -p ../output
          
          # همه فایل‌های APK دانلود شده رو فشرده کن
          for f in *.apk *.xapk *.apkm; do
            if [ -f "$f" ]; then
              7z a -mx=1 -v85m "../output/${f}.7z" "$f"
            fi
          done
          
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "هیچ فایلی پیدا نشد!"
            exit 1
          else
            git commit -m "Download ${{ inputs.package_name }} (${{ inputs.architecture }})"
            git push
            echo "فایل APK با موفقیت ذخیره شد!"
          fi
