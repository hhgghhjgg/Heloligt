name: مخصوص دانلود از لینک download.php?id=116659

on:
  workflow_dispatch:
    inputs:
      download_link:
        description: 'لینک دانلود (پیش‌فرض برای مدل 116659)'
        required: true
        default: 'https://open3dmodel.com/download.php?id=116659'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install all Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libu2f-udev \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xdg-utils

      - name: Install Puppeteer
        run: |
          npm init -y
          npm install puppeteer

      - name: Download model (specialized for download.php)
        env:
          DOWNLOAD_LINK: ${{ inputs.download_link }}
        run: |
          node --max-old-space-size=4096 << 'SCRIPT_EOF'
          const puppeteer = require("puppeteer");
          const fs = require("fs");
          const path = require("path");

          const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const downloadLink = process.env.DOWNLOAD_LINK;
            const downloadDir = path.resolve("3d-models");
            if (!fs.existsSync(downloadDir)) {
              fs.mkdirSync(downloadDir, { recursive: true });
            }

            let browser = null;
            let page = null;

            try {
              console.log("🚀 Launching Chromium browser...");
              browser = await puppeteer.launch({
                headless: "new",
                args: [
                  "--no-sandbox",
                  "--disable-setuid-sandbox",
                  "--disable-dev-shm-usage",
                  "--disable-accelerated-2d-canvas",
                  "--no-first-run",
                  "--no-zygote",
                  "--disable-gpu",
                  "--disable-web-security",
                  "--disable-features=IsolateOrigins,site-per-process"
                ]
              });

              page = await browser.newPage();
              await page.setUserAgent(
                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 " +
                "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              );

              // تنظیم دانلود
              const client = await page.target().createCDPSession();
              await client.send("Browser.setDownloadBehavior", {
                behavior: "allow",
                downloadPath: downloadDir,
                eventsEnabled: true
              });

              // مانیتورینگ دانلود
              const downloadPromises = [];
              client.on("Browser.downloadProgress", (event) => {
                if (event.state === "completed") {
                  console.log(`✅ Download completed: ${event.guid}`);
                } else if (event.state === "canceled") {
                  console.log(`❌ Download canceled: ${event.guid}`);
                }
                // ذخیره وعده‌ها برای همگام‌سازی
                downloadPromises.push(event);
              });

              console.log(`🌐 Navigating to: ${downloadLink}`);
              await page.goto(downloadLink, {
                waitUntil: "networkidle2",
                timeout: 60000
              });

              console.log("⏳ Waiting for JavaScript redirects...");
              // صبر طولانی برای اجرای کامل JS و شروع دانلود
              await wait(10000);

              // گرفتن اسکرین‌شات برای بررسی وضعیت
              await page.screenshot({ path: "download_page.png" });
              console.log("📸 Screenshot saved as download_page.png");

              // صبر اضافی برای تکمیل دانلود
              await wait(15000);

            } catch (error) {
              console.error("❌ Error:", error.message);
              if (page) {
                try { await page.screenshot({ path: "debug_error.png" }); } catch (e) {}
              }
            } finally {
              if (browser) {
                await browser.close();
                console.log("✔️ Browser closed");
              }
            }

            // بررسی فایل‌های دانلود شده
            if (fs.existsSync(downloadDir)) {
              const files = fs.readdirSync(downloadDir).filter(f => {
                const p = path.join(downloadDir, f);
                return fs.statSync(p).isFile();
              });
              console.log(`\n📁 Files in 3d-models (${files.length}):`);

              let downloadedSomething = false;
              for (const file of files) {
                const fp = path.join(downloadDir, file);
                const sizeKB = Math.round(fs.statSync(fp).size / 1024);
                console.log(`  📦 ${file} (${sizeKB} KB)`);
                if (sizeKB > 100) downloadedSomething = true;
              }

              if (!downloadedSomething) {
                console.log("\n⚠️ Download did not start or file is very small.");
              }
            } else {
              console.log("⚠️ 3d-models directory not found.");
            }

            console.log("\n✨ Script finished!");
          })();
          SCRIPT_EOF

      - name: Commit all files (even HTML for debugging)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p 3d-models
          git add 3d-models/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No files to commit"
          else
            git commit -m "📦 Attempted download from download.php?id=${{ inputs.download_link }}"
            git pull --rebase && git push
          fi

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: download-page-screenshots
          path: |
            download_page.png
            debug_error.png
          retention-days: 3
