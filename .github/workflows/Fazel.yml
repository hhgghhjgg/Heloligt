name: Download APK with apkeep

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'نام پکیج (مثلاً com.deepseek.chat)'
        required: true
        type: string
        default: 'com.deepseek.chat'
      version:
        description: 'نسخه برنامه (اختیاری، مثال: @1.2.3)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup directories
        run: mkdir -p downloads output

      - name: Download apkeep binary
        run: |
          APKEEP_VERSION="1.0.0"
          DOWNLOAD_URL="https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/apkeep-x86_64-unknown-linux-gnu"
          
          echo "Downloading apkeep v${APKEEP_VERSION}..."
          curl -L -o apkeep "$DOWNLOAD_URL"
          chmod +x apkeep
          ./apkeep --version

      - name: Download APK from APKPure
        env:
          PACKAGE: ${{ inputs.package_name }}
          VERSION: ${{ inputs.version }}
        run: |
          APP_ID="${PACKAGE}${VERSION}"
          
          echo "Downloading: ${APP_ID}"
          echo "Source: APKPure (no credentials needed)"
          
          ./apkeep -a "${APP_ID}" -d apk-pure ./downloads/
          
          echo "Download completed. Files:"
          ls -la ./downloads/

      - name: Compress APK
        run: |
          cd downloads
          for f in *.apk *.xapk *.apks; do
            if [ -f "$f" ]; then
              echo "Compressing $f..."
              7z a -mx=3 -v85m "../output/${f}.7z" "$f"
            fi
          done
          cd ..

      - name: Push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No APK downloaded."
            exit 1
          else
            git commit -m "Download ${{ inputs.package_name }}${{ inputs.version }} from APKPure"
            git push
            echo "APK pushed to repository!"
          fi
