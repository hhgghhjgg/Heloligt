name: Download 3D Model from Open3DModel (Puppeteer)

on:
  workflow_dispatch:
    inputs:
      model_page:
        description: 'لینک صفحه مدل'
        required: true
        type: string
        default: 'https://open3dmodel.com/3d-models/3d-model-cute-anime-school-girl_116659.html'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libatspi2.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libu2f-udev \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xdg-utils

      - name: Install Puppeteer
        run: |
          npm init -y
          npm install puppeteer

      - name: Download model with Puppeteer
        run: |
          node --max-old-space-size=4096 << 'NODEEOF'
          const puppeteer = require("puppeteer");
          const fs = require("fs");
          const path = require("path");
          
          const MODEL_PAGE = process.env.MODEL_PAGE || "${{ inputs.model_page }}";
          
          (async () => {
            console.log("🚀 Starting browser...");
            const browser = await puppeteer.launch({
              headless: "new",
              args: [
                "--no-sandbox",
                "--disable-setuid-sandbox",
                "--disable-dev-shm-usage",
                "--disable-accelerated-2d-canvas",
                "--no-first-run",
                "--no-zygote",
                "--disable-gpu",
                "--disable-web-security",
                "--disable-features=IsolateOrigins,site-per-process"
              ]
            });
            
            try {
              const page = await browser.newPage();
              
              // Set user agent to avoid detection
              await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");
              
              // Set download directory
              const downloadDir = path.resolve("3d-models");
              if (!fs.existsSync(downloadDir)) {
                fs.mkdirSync(downloadDir, { recursive: true });
              }
              
              // Enable download behavior
              const client = await page.target().createCDPSession();
              await client.send("Browser.setDownloadBehavior", {
                behavior: "allow",
                downloadPath: downloadDir,
                eventsEnabled: true
              });
              
              // Listen for downloads
              client.on("Browser.downloadProgress", (event) => {
                if (event.state === "completed") {
                  console.log(`✅ Download completed: ${event.guid}`);
                } else if (event.state === "canceled") {
                  console.log(`❌ Download canceled: ${event.guid}`);
                }
              });
              
              console.log("🌐 Loading model page:", MODEL_PAGE);
              
              // Go to the model page
              await page.goto(MODEL_PAGE, {
                waitUntil: "networkidle2",
                timeout: 60000
              });
              
              console.log("📄 Page loaded. Extracting content...");
              await page.waitForTimeout(3000);
              
              // Take screenshot for debugging
              await page.screenshot({ path: "debug_before.png" });
              console.log("📸 Screenshot saved");
              
              // Try multiple methods to find and click download link
              let downloaded = false;
              
              // Method 1: Look for elements with specific text
              const downloadSelectors = [
                'a:has-text("Download")',
                'a:has-text("download")',
                'a:has-text("Free Download")',
                'a[class*="download"]',
                'a[class*="edd"]',
                'button:has-text("Download")',
                '.edd_download',
                '.download-link',
                'a[href*="token_id"]',
                'a[href*="edd_action"]',
                'a[href*="download"]'
              ];
              
              for (const selector of downloadSelectors) {
                try {
                  const element = await page.$(selector);
                  if (element) {
                    const href = await element.evaluate(el => el.href || el.getAttribute("href") || "");
                    const text = await element.evaluate(el => el.textContent.trim());
                    console.log(`Found element: "${text}" -> ${href.substring(0, 100)}`);
                    
                    // Click the element
                    await Promise.all([
                      element.click(),
                      page.waitForNavigation({ waitUntil: "networkidle2", timeout: 15000 }).catch(() => {})
                    ]);
                    
                    console.log("Clicked! Waiting for download...");
                    await page.waitForTimeout(5000);
                    downloaded = true;
                    break;
                  }
                } catch (e) {
                  continue;
                }
              }
              
              if (!downloaded) {
                // Method 2: Find all links and try each
                console.log("Method 1 failed. Trying all links...");
                const allLinks = await page.evaluate(() => {
                  return Array.from(document.querySelectorAll("a[href]")).map(a => ({
                    href: a.href,
                    text: a.textContent.trim().substring(0, 50)
                  }));
                });
                
                console.log(`Found ${allLinks.length} total links`);
                
                // Filter for download-related links
                const potentialDownloads = allLinks.filter(link => 
                  link.href.includes("token_id") ||
                  link.href.includes("download") ||
                  link.href.includes("edd") ||
                  link.text.toLowerCase().includes("download")
                );
                
                console.log(`Found ${potentialDownloads.length} potential download links`);
                
                for (const link of potentialDownloads) {
                  console.log(`Trying: ${link.href.substring(0, 100)}`);
                  try {
                    await page.goto(link.href, {
                      waitUntil: "networkidle2",
                      timeout: 15000
                    });
                    await page.waitForTimeout(3000);
                    downloaded = true;
                    break;
                  } catch (e) {
                    console.log("Failed, trying next...");
                  }
                }
              }
              
              // Wait for downloads to complete
              console.log("⏳ Waiting for downloads to finish...");
              await page.waitForTimeout(8000);
              
              // Take final screenshot
              await page.screenshot({ path: "debug_after.png" });
              
            } catch (error) {
              console.error("Error:", error.message);
              await page.screenshot({ path: "debug_error.png" });
            } finally {
              await browser.close();
              console.log("✅ Browser closed");
            }
            
            // Check downloaded files
            const downloadDir = path.resolve("3d-models");
            if (fs.existsSync(downloadDir)) {
              const files = fs.readdirSync(downloadDir);
              console.log(`\n📁 Files in 3d-models (${files.length}):`);
              
              let hasValidFiles = false;
              files.forEach(file => {
                const filePath = path.join(downloadDir, file);
                const stats = fs.statSync(filePath);
                if (stats.isFile()) {
                  const sizeKB = Math.round(stats.size / 1024);
                  console.log(`  ${stats.size > 50000 ? "✅" : "⚠️"} ${file} (${sizeKB}KB)`);
                  if (stats.size > 50000) hasValidFiles = true;
                }
              });
              
              if (!hasValidFiles) {
                console.log("\n⚠️ No large files found. This might mean:");
                console.log("  1. The download didn't start");
                console.log("  2. The file is very small");
                console.log("  3. We got an HTML page instead of a model file");
                
                // Check if any file is actually HTML
                files.forEach(file => {
                  const filePath = path.join(downloadDir, file);
                  const content = fs.readFileSync(filePath, "utf8").substring(0, 100);
                  if (content.includes("<!DOCTYPE") || content.includes("<html")) {
                    console.log(`  ❌ ${file} is actually HTML, not a 3D model!`);
                  }
                });
              }
            }
            
            console.log("\n✨ Script finished!");
          })();
          NODEEOF
        env:
          MODEL_PAGE: ${{ inputs.model_page }}

      - name: Commit downloaded models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create directory if not exists
          mkdir -p 3d-models
          
          # Add only actual model files (not HTML pages disguised as files)
          find 3d-models/ -type f -size +50k ! -name "*.html" -exec git add {} + 2>/dev/null || true
          
          # Also check for files that might not have extensions
          find 3d-models/ -type f -size +100k -exec file {} \; | grep -i "zip\|rar\|archive\|data" | cut -d: -f1 | xargs -r git add 2>/dev/null || true
          
          if git diff --cached --quiet; then
            echo "No valid model files to commit"
            echo "Listing all files in 3d-models for debugging:"
            ls -lah 3d-models/ 2>/dev/null || echo "Directory empty or doesn't exist"
          else
            git commit -m "📦 Downloaded 3D model"
            git pull --rebase && git push
            echo "✅ Committed and pushed!"
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            debug_*.png
          retention-days: 3
