name: Download from Open3DModel Direct Link

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Direct download link'
        required: true
        type: string
        default: 'https://open3dmodel.com/?token_id=NFRYUzZKWFlyQmFTb0FvZDhRaXZEZz09&key=YWRuWVc1OGFlazR2cnE4am5TaDVGUT09'
      filename:
        description: 'File name (optional)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download File
        run: |
          mkdir -p 3d-models
          URL="${{ inputs.download_url }}"
          FNAME="${{ inputs.filename }}"

          echo "📥 Downloading: $URL"

          # Follow redirects and get filename from headers
          RESPONSE=$(curl -L -o "3d-models/temp_download" -w "%{http_code}|%{url_effective}|%{filename_effective}" -s "$URL")
          HTTP_CODE=$(echo "$RESPONSE" | cut -d'|' -f1)
          FINAL_URL=$(echo "$RESPONSE" | cut -d'|' -f2)

          if [ "$HTTP_CODE" = "200" ]; then
              # Try to get filename from Content-Disposition
              CD_FILENAME=$(curl -L -I -s "$FINAL_URL" | grep -i "Content-Disposition" | sed -n 's/.*filename="\?\([^";]*\)"\?.*/\1/p')

              if [ -n "$FNAME" ]; then
                  mv "3d-models/temp_download" "3d-models/$FNAME"
                  echo "  ✅ Saved as: $FNAME"
              elif [ -n "$CD_FILENAME" ]; then
                  mv "3d-models/temp_download" "3d-models/$CD_FILENAME"
                  echo "  ✅ Saved as: $CD_FILENAME"
              else
                  EXT="${FINAL_URL##*.}"
                  EXT=$(echo "$EXT" | cut -d'?' -f1)
                  mv "3d-models/temp_download" "3d-models/model.$EXT"
                  echo "  ✅ Saved as: model.$EXT"
              fi
              ls -la 3d-models/
          else
              echo "❌ HTTP $HTTP_CODE"
              rm -f 3d-models/temp_download
          fi

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 3d-models/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "📦 Downloaded 3D model"
            git pull --rebase && git push
          fi
