name: دانلود APK با Puppeteer v2

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'نام پکیج (مثلاً com.deepseek.chat)'
        required: true
        type: string
        default: 'com.deepseek.chat'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install puppeteer

      - name: Download APK
        env:
          PACKAGE: ${{ inputs.package_name }}
        run: |
          mkdir -p downloads
          node - << 'NODEEOF'
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const package_name = process.env.PACKAGE;
            // آدرس مستقیم که خودت دادی
            const downloadUrl = `https://apkcombo.com/deepseek-ai-assistant/${package_name}/`;
            
            console.log(`Launching browser...`);
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');
            
            console.log(`Navigating to: ${downloadUrl}`);
            await page.goto(downloadUrl, { waitUntil: 'networkidle2', timeout: 60000 });
            
            // صبر برای لود شدن کامل صفحه
            await page.waitForTimeout(5000);
            
            // استخراج لینک دانلود
            let downloadLink = null;
            
            // روش ۱: جستجوی هر لینکی که به apk ختم بشه
            try {
              downloadLink = await page.evaluate(() => {
                const allLinks = Array.from(document.querySelectorAll('a'));
                for (let link of allLinks) {
                  if (link.href && link.href.includes('.apk')) {
                    return link.href;
                  }
                }
                return null;
              });
              if (downloadLink) console.log(`Found APK link via generic search: ${downloadLink}`);
            } catch(e) {}
            
            // روش ۲: جستجوی دکمه دانلود با کلاس‌های رایج
            if (!downloadLink) {
              try {
                downloadLink = await page.evaluate(() => {
                  const selectors = [
                    'a.download-btn',
                    'a#download-btn',
                    'a[href*="download"]',
                    'a.info-down'
                  ];
                  for (let sel of selectors) {
                    const el = document.querySelector(sel);
                    if (el && el.href) return el.href;
                  }
                  return null;
                });
                if (downloadLink) console.log(`Found download link via selectors: ${downloadLink}`);
              } catch(e) {}
            }
            
            if(!downloadLink) {
              console.error('No download link found!');
              const pageContent = await page.content();
              console.log('Page content (first 1500 chars): ', pageContent.substring(0, 1500));
              await browser.close();
              process.exit(1);
            }

            console.log(`Downloading from: ${downloadLink}`);
            
            const downloadPath = path.resolve('./downloads');
            const fileName = `${package_name}.apk`;
            const filePath = path.join(downloadPath, fileName);
            
            // رفتن به لینک دانلود و گرفتن فایل
            const response = await page.goto(downloadLink, { 
              waitUntil: 'networkidle2',
              timeout: 120000
            });
            
            if(response && response.ok()) {
              const buffer = await response.buffer();
              fs.writeFileSync(filePath, buffer);
              console.log(`SUCCESS! Downloaded to: ${filePath} (${buffer.length} bytes)`);
            } else {
              console.error(`Download failed with status: ${response?.status()}`);
              await browser.close();
              process.exit(1);
            }
            
            await browser.close();
          })();
          NODEEOF

      - name: Compress and push APK
        run: |
          cd downloads
          mkdir -p ../output
          f=$(ls -1 *.apk 2>/dev/null | head -n1)
          if [ -n "$f" ] && [ -f "$f" ]; then
            7z a -mx=1 -v85m "../output/${f}.7z" "$f"
          else
            echo "No APK found!"
            exit 1
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes to push."
          else
            git commit -m "Download ${{ inputs.package_name }} via Puppeteer v2"
            git push
          fi
