name: Ultimate Stealth Download (CommonJS Fixed)

on:
  workflow_dispatch:
    inputs:
      model_page:
        description: 'آدرس صفحه مدل'
        required: true
        default: 'https://open3dmodel.com/3d-models/3d-model-cute-anime-school-girl_116659.html'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean old configs and install system dependencies
        run: |
          rm -f package.json package-lock.json
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libu2f-udev \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xdg-utils

      - name: Install puppeteer-extra with stealth plugin
        run: |
          npm init -y
          npm install puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Write and execute download script
        env:
          MODEL_PAGE: ${{ inputs.model_page }}
        run: |
          cat > download_script.cjs << 'SCRIPT_EOF'
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          const fs = require('fs');
          const path = require('path');

          puppeteer.use(StealthPlugin());

          const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
          const modelPage = process.env.MODEL_PAGE;
          const downloadDir = path.resolve("3d-models");
          if (!fs.existsSync(downloadDir)) fs.mkdirSync(downloadDir, { recursive: true });

          let browser = null;
          let page = null;

          (async () => {
            try {
              console.log("🚀 راه‌اندازی مرورگر مخفی‌کار...");
              browser = await puppeteer.launch({
                headless: "new",
                args: [
                  "--no-sandbox",
                  "--disable-setuid-sandbox",
                  "--disable-dev-shm-usage",
                  "--disable-gpu",
                  "--disable-web-security",
                  "--disable-features=IsolateOrigins,site-per-process"
                ]
              });

              page = await browser.newPage();

              // تنظیم مسیر دانلود
              const client = await page.target().createCDPSession();
              await client.send("Browser.setDownloadBehavior", {
                behavior: "allow",
                downloadPath: downloadDir,
                eventsEnabled: true
              });

              console.log(`🌐 بارگذاری صفحه مدل: ${modelPage}`);
              await page.goto(modelPage, { waitUntil: "networkidle2", timeout: 60000 });

              console.log("🔍 جستجوی دکمه دانلود...");
              const downloadBtnSelector = 'a[href*="download.php"]';
              await page.waitForSelector(downloadBtnSelector, { timeout: 15000 });
              const downloadButton = await page.$(downloadBtnSelector);

              if (downloadButton) {
                console.log("🖱️ کلیک روی دکمه دانلود...");
                await downloadButton.click();
                console.log("⏳ منتظر اجرای جاوااسکریپت و شروع دانلود...");
                await wait(20000);
              } else {
                console.log("❌ دکمه دانلود پیدا نشد.");
              }

              console.log("📸 گرفتن اسکرین‌شات نهایی...");
              await page.screenshot({ path: "screenshot_final.png" });

            } catch (error) {
              console.error("❌ خطا:", error.message);
              if (page) {
                try {
                  await page.screenshot({ path: "screenshot_error.png" });
                } catch (e) {}
              }
            } finally {
              if (browser) {
                await browser.close();
                console.log("✔️ مرورگر بسته شد");
              }
            }

            // گزارش فایل‌های دانلود شده
            if (fs.existsSync(downloadDir)) {
              const files = fs.readdirSync(downloadDir).filter(f => {
                const fullPath = path.join(downloadDir, f);
                return fs.statSync(fullPath).isFile();
              });
              console.log(`\n📁 فایل‌های موجود در 3d-models (${files.length} عدد):`);
              files.forEach(f => {
                const fullPath = path.join(downloadDir, f);
                const sizeKB = Math.round(fs.statSync(fullPath).size / 1024);
                console.log(`  📦 ${f} (${sizeKB} KB)`);
              });
            } else {
              console.log("⚠️ پوشه 3d-models پیدا نشد.");
            }
            console.log("\n✨ پایان اسکریپت.");
          })();
          SCRIPT_EOF

          node download_script.cjs

      - name: Commit all files (models + screenshots)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p 3d-models
          git add -f 3d-models/ 2>/dev/null || true
          git add -f screenshot_final.png screenshot_error.png 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No files to commit"
          else
            git commit -m "📦 دانلود مدل + اسکرین‌شات"
            git pull --rebase && git push
            echo "✅ فایل‌ها با موفقیت در مخزن ذخیره شدند."
          fi

      - name: Upload screenshots as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshot_final.png
            screenshot_error.png
          retention-days: 7
