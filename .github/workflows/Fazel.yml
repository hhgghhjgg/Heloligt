name: Objaverse Anime 3D Model Downloader

on:
  workflow_dispatch:
    inputs:
      search_keyword:
        description: 'کلمه کلیدی برای جستجوی مدل انیمه‌ای (مثلاً anime, cartoon, character)'
        required: false
        type: string
        default: 'anime'
      max_models:
        description: 'حداکثر تعداد مدل برای دانلود'
        required: false
        type: string
        default: '3'
      format:
        description: 'فرمت فایل'
        required: false
        type: choice
        options:
          - 'glb'
          - 'gltf'
          - 'obj'
          - 'fbx'
        default: 'glb'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python Dependencies
        run: pip install requests huggingface_hub tqdm

      - name: Download Anime 3D Models
        env:
          SEARCH_KEYWORD: ${{ github.event.inputs.search_keyword }}
          MAX_MODELS: ${{ github.event.inputs.max_models }}
          FORMAT: ${{ github.event.inputs.format }}
        run: |
          python3 << 'PYEOF'
          import requests, json, os, sys, time, re
          from pathlib import Path
          from tqdm import tqdm

          repo_id = "allenai/objaverse-xl"
          repo_type = "dataset"
          keyword = os.environ.get("SEARCH_KEYWORD", "anime")
          max_models = int(os.environ.get("MAX_MODELS", "3"))
          fmt = os.environ.get("FORMAT", "glb")

          print(f"🔍 Searching for '{keyword}' models in {repo_id}")
          
          # ۱. دریافت لیست فایل‌ها
          api_url = f"https://huggingface.co/api/datasets/{repo_id}"
          resp = requests.get(api_url, timeout=30)
          if resp.status_code != 200:
              print(f"❌ API failed: {resp.status_code}")
              sys.exit(1)
          
          data = resp.json()
          siblings = data.get("siblings", [])
          print(f"📊 Total files in repo: {len(siblings)}")
          
          # ۲. فیلتر فایل‌های با فرمت مورد نظر و کلمه کلیدی
          matching = []
          keywords = [keyword, "cartoon", "character", "person", "human", "figure"]
          
          for sib in siblings:
              fname = sib.get("rfilename", "").lower()
              if fname.endswith(f".{fmt}") or fname.endswith(f".{fmt}.gz"):
                  if any(kw in fname for kw in keywords):
                      matching.append(sib)
              elif fmt == "glb" and (fname.endswith(".glb") or fname.endswith(".glb.gz")):
                  if any(kw in fname for kw in keywords):
                      matching.append(sib)
              elif fmt == "gltf" and (fname.endswith(".gltf") or fname.endswith(".gltf.gz")):
                  if any(kw in fname for kw in keywords):
                      matching.append(sib)
          
          print(f"🎯 Found {len(matching)} matching models")
          
          if len(matching) == 0:
              print("⚠️ No exact matches. Trying broad search...")
              for sib in siblings:
                  fname = sib.get("rfilename", "").lower()
                  if fname.endswith(f".{fmt}") or fname.endswith(f".{fmt}.gz"):
                      matching.append(sib)
              print(f"🎯 Broad search found {len(matching)} models")
          
          # ۳. انتخاب چند مدل
          selected = matching[:max_models]
          print(f"📥 Downloading {len(selected)} models...")
          
          output_dir = Path("objaverse-models")
          output_dir.mkdir(parents=True, exist_ok=True)
          
          downloaded = []
          for sib in tqdm(selected, desc="Downloading"):
              fname = sib["rfilename"]
              download_url = f"https://huggingface.co/datasets/{repo_id}/resolve/main/{fname}"
              local_path = output_dir / Path(fname).name
              
              try:
                  dl_resp = requests.get(download_url, timeout=120, stream=True)
                  if dl_resp.status_code == 200:
                      with open(local_path, "wb") as f:
                          for chunk in dl_resp.iter_content(8192):
                              f.write(chunk)
                      size = local_path.stat().st_size // 1024
                      print(f"  ✅ {Path(fname).name} ({size}KB)")
                      downloaded.append(str(local_path))
                  else:
                      print(f"  ❌ {fname}: HTTP {dl_resp.status_code}")
              except Exception as e:
                  print(f"  ❌ {fname}: {str(e)[:50]}")
          
          print(f"\n✅ Downloaded {len(downloaded)} models to {output_dir}/")
          PYEOF

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add objaverse-models/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "📦 Objaverse anime 3D models (${{ github.event.inputs.format }}) | $(date +%Y-%m-%d_%H:%M)"
            git pull --rebase && git push
          fi
