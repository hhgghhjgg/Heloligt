name: دانلود مستقیم از گوگل پلی

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'نام پکیج برنامه (مثلاً com.deepseek.chat)'
        required: true
        type: string
      architecture:
        description: 'معماری پردازنده'
        required: true
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
        default: 'arm64-v8a'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Google Play API
        run: |
          pip install googleplay-api

      - name: Download APK from Google Play
        env:
          PACKAGE: ${{ inputs.package_name }}
          ARCH: ${{ inputs.architecture }}
        run: |
          mkdir -p downloads
          
          echo "Downloading $PACKAGE for $ARCH directly from Google Play..."
          
          python -m googleplay_api download \
            "$PACKAGE" \
            --arch "$ARCH" \
            --output downloads/
          
          if [ $? -ne 0 ]; then
            echo "First attempt failed, trying with alternative device config..."
            # تلاش دوباره با تنظیمات متفاوت
            python -m googleplay_api download \
              "$PACKAGE" \
              --arch "$ARCH" \
              --device "flame" \
              --output downloads/
          fi
          
          echo "Download completed. Files in downloads/:"
          ls -la downloads/

      - name: Compress APK for storage
        run: |
          cd downloads
          
          # پیدا کردن فایل APK دانلود شده
          APK_FILE=$(ls -1 *.apk 2>/dev/null | head -n1)
          
          if [ -z "$APK_FILE" ]; then
            # شاید اسپلیت APK باشه
            APK_ZIP=$(ls -1 *.zip 2>/dev/null | head -n1)
            if [ -n "$APK_ZIP" ]; then
              APK_FILE="$APK_ZIP"
            else
              echo "هیچ فایل APK یا ZIP پیدا نشد!"
              ls -la
              exit 1
            fi
          fi
          
          echo "Compressing $APK_FILE..."
          mkdir -p ../output
          7z a -mx=3 -v85m "../output/${APK_FILE}.7z" "$APK_FILE"
          
          echo "Compression completed."

      - name: Push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          
          if git diff --staged --quiet; then
            echo "تغییری برای commit وجود ندارد."
          else
            git commit -m "Download ${{ inputs.package_name }} directly from Google Play"
            git push
            echo "دانلود و ذخیره با موفقیت انجام شد!"
          fi
