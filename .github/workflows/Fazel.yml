name: دانلود فایل نصبی گوگل پلی

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'نام پکیج برنامه (مثلاً com.deepseek.chat)'
        required: true
        type: string
        default: 'com.deepseek.chat'
      architecture:
        description: 'معماری پردازنده'
        required: true
        type: choice
        default: 'arm64'
        options:
          - arm64
          - armv7
          - x86_64
          - all

permissions:
  contents: write

jobs:
  download-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install gplaydl
        run: |
          pip install gplaydl

      - name: Create output folder
        run: mkdir -p downloads

      - name: Authenticate and download APK
        id: download
        run: |
          # احراز هویت خودکار
          echo "Authenticating..."
          gplaydl auth
          
          # تعیین معماری
          ARCH="${{ inputs.architecture }}"
          if [ "$ARCH" = "all" ]; then
            ARCH_FLAG=""
          else
            ARCH_FLAG="--arch $ARCH"
          fi
          
          # دانلود
          echo "Downloading ${{ inputs.package_name }}..."
          gplaydl download ${{ inputs.package_name }} $ARCH_FLAG -o downloads
          
          # پیدا کردن فایل دانلود شده
          cd downloads
          DOWNLOADED_FILE=$(ls -1t *.apk 2>/dev/null | head -n1)
          
          if [ -z "$DOWNLOADED_FILE" ]; then
            echo "Error: No APK downloaded"
            # نمایش فایل‌های موجود برای دیباگ
            echo "Files in downloads folder:"
            ls -la
            exit 1
          fi
          
          echo "Downloaded: $DOWNLOADED_FILE"
          echo "downloaded_file=$DOWNLOADED_FILE" >> $GITHUB_OUTPUT
        continue-on-error: false

      - name: Compress APK for storage
        if: success()
        run: |
          cd downloads
          APK_FILE="${{ steps.download.outputs.downloaded_file }}"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          PACKAGE="${{ inputs.package_name }}"
          ARCH="${{ inputs.architecture }}"
          
          # فشرده‌سازی با 7z
          7z a -mx=3 -v85m "${PACKAGE}_${ARCH}_${TIMESTAMP}.7z" "$APK_FILE"
          
          # حذف فایل اصلی APK برای صرفه‌جویی در فضای مخزن
          rm "$APK_FILE"
          
          echo "Compressed and cleaned up."

      - name: Commit and push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "دانلود ${{ inputs.package_name }} (${{ inputs.architecture }}) از گوگل پلی"
            git push
            echo "Successfully pushed to repository!"
          fi
