name: Download APK from APKPure

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'نام بسته (package name) برنامه'
        required: true
        type: string
        default: 'com.instagram.android'
      architecture:
        description: 'معماری پردازنده'
        required: true
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - all

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install apkpure
        run: pip install apkpure

      - name: Download APK
        env:
          PACKAGE: ${{ inputs.package_name }}
          ARCH: ${{ inputs.architecture }}
        run: |
          echo "Downloading $PACKAGE for architecture $ARCH..."
          # apkpure یک دستور CLI به اسم apkpure هم داره
          # نحو استفاده: apkpure download <pkg> --arch <arch> -o <dir>
          python -m apkpure download $PACKAGE --arch $ARCH -o downloads

      - name: Organize and compress
        run: |
          cd downloads
          mkdir -p ../output
          for f in *.apk; do
            if [ -f "$f" ]; then
              7z a -mx=3 -v85m "../output/$f.7z" "$f"
            fi
          done
          # حذف فایل اصلی برای خالی موندن پوشه downloads
          rm -f *.apk

      - name: Commit and push APKs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No APK found."
          else
            git commit -m "Add ${{ inputs.package_name }} (${{ inputs.architecture }}) from APKPure"
            git push
          fi
