name: Download APK with apkeep

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package name of the app (e.g., com.instagram.android)'
        required: true
        type: string
      source:
        description: 'Download source'
        required: true
        type: choice
        default: 'apkpure'
        options:
          - apkpure
          - fdroid

permissions:
  contents: write

jobs:
  download-apk:
    runs-on: ubuntu-latest
    steps:
      # ۱. بررسی مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # ۲. ایجاد پوشه خروجی
      - name: Create output folder
        run: mkdir -p downloads

      # ۳. دانلود و نصب apkeep
      - name: Install apkeep
        run: |
          # apkeep یه ابزار Rust هست. ما نسخه کامپایل شده برای لینوکس رو مستقیم دانلود می‌کنیم
          curl -L -o apkeep.tar.gz https://github.com/EFForg/apkeep/releases/download/v0.17.0/apkeep-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf apkeep.tar.gz
          chmod +x apkeep

      # ۴. دانلود فایل APK
      - name: Download APK from ${{ inputs.source }}
        run: |
          echo "Attempting to download ${{ inputs.package_name }} from ${{ inputs.source }}..."
          ./apkeep -a ${{ inputs.package_name }} -d ${{ inputs.source }} -o downloads .
          echo "Download attempt finished."

      # ۵. فشرده‌سازی و ذخیره‌سازی
      - name: Compress and push APKs to repository
        run: |
          cd downloads
          # فایل‌های APK رو با ۷z به صورت قطعات ۸۵ مگابایتی فشرده کن 
          for file in *.apk; do
            if [ -f "$file" ]; then
              echo "Compressing $file..."
              7z a -mx=3 -v85m "compressed_${file}.7z" "$file"
              # حذف فایل اصلی برای صرفه‌جویی در فضای مخزن
              rm "$file"
            fi
          done
          
          # برای Split APK ها
          for file in *.zip; do
            if [ -f "$file" ]; then
              echo "Compressing $file..."
              7z a -mx=3 -v85m "compressed_${file}.7z" "$file"
              rm "$file"
            fi
          done

      - name: Commit and push to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/
          if git diff --staged --quiet; then
            echo "No changes to commit. The app might not be available."
          else
            git commit -m "Download ${{ inputs.package_name }} from ${{ inputs.source }} [skip ci]"
            git push
            echo "APK successfully pushed to repository!"
          fi
