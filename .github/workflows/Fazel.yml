name: Download 3D Model - Hybrid FlareSolverr + Requests

on:
  workflow_dispatch:
    inputs:
      model_page:
        description: 'لینک صفحه مدل'
        required: true
        type: string
        default: 'https://open3dmodel.com/3d-models/3d-model-cute-anime-school-girl_116659.html'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 15); do
            STATUS=$(curl -s http://localhost:8191/v1 | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))")
            [ "$STATUS" = "ok" ] && echo "✅ Ready" && break
            sleep 4
          done

      - name: Install Python deps
        run: pip install requests beautifulsoup4

      - name: Download Model (Smart Extraction + Cookies)
        run: |
          python3 << 'PYEOF'
          import requests, os, re, sys, time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          model_page = "${{ inputs.model_page }}"
          FLARE = "http://localhost:8191/v1"

          # ─── 1. Get page with FlareSolverr ─────────────────────
          print(f"🌐 Getting model page: {model_page}")
          r = requests.post(FLARE, json={
              "cmd": "request.get",
              "url": model_page,
              "maxTimeout": 60000
          }, timeout=120)

          if r.status_code != 200:
              print("❌ FlareSolverr failed")
              sys.exit(1)

          data = r.json()
          if data.get("status") != "ok":
              print("❌ Challenge not solved")
              sys.exit(1)

          html = data["solution"]["response"]
          cookies = data["solution"].get("cookies", [])
          ua = data["solution"].get("userAgent", "Mozilla/5.0")

          print("✅ Page fetched. Cookies:", len(cookies), "UA:", ua[:50])

          # ─── 2. Extract download link ─────────────────────────
          soup = BeautifulSoup(html, "html.parser")
          download_url = None

          # Search for links that look like download
          for a in soup.find_all("a", href=True):
              href = a["href"].strip()
              text = a.get_text(strip=True).lower()
              if any(k in href for k in ["download.php", "edd_action", "token_id"]) or \
                 "download" in text or "free download" in text:
                  download_url = urljoin(model_page, href)
                  print(f"🔗 Found: {text[:60]} -> {download_url[:100]}...")
                  break

          # If not found by text, try href pattern
          if not download_url:
              for a in soup.find_all("a", href=True):
                  href = a["href"].strip()
                  if "download" in href.lower() or "token_id=" in href or "key=" in href:
                      download_url = urljoin(model_page, href)
                      print(f"🔗 Found by href: {download_url[:120]}...")
                      break

          if not download_url:
              print("❌ No download link found")
              sys.exit(1)

          # ─── 3. Download the real file with cookies ───────────
          print(f"📥 Downloading: {download_url}")
          ses = requests.Session()
          ses.headers.update({
              "User-Agent": ua,
              "Referer": model_page,
              "Accept": "*/*",
              "Accept-Language": "en-US,en;q=0.9",
              "Connection": "keep-alive"
          })

          # Set cookies from FlareSolverr
          for c in cookies:
              ses.cookies.set(c["name"], c["value"], domain=c.get("domain"))

          # Send request
          resp = ses.get(download_url, timeout=120, stream=True, allow_redirects=True)

          if resp.status_code != 200:
              print(f"❌ HTTP {resp.status_code}")
              sys.exit(1)

          # Check if response is actually a file or HTML
          content_type = resp.headers.get("Content-Type", "").lower()
          cd = resp.headers.get("Content-Disposition", "")

          # Read first bytes to detect HTML
          first_chunk = resp.raw.peek(512)[:512]
          is_html = b"<!DOCTYPE" in first_chunk or b"<html" in first_chunk

          if is_html and "text/html" in content_type:
              print("❌ Response is HTML, not a file. Server rejected the request.")
              print("First bytes:", first_chunk[:200])
              sys.exit(1)

          # Determine filename
          fname = None
          if cd:
              match = re.search(r'filename="?([^";\s]+)"?', cd)
              if match:
                  fname = match.group(1)
          if not fname:
              # Use basename from URL
              fname = os.path.basename(urlparse(download_url).path)
              if not fname or fname == "":
                  fname = "model.zip"  # fallback

          # Clean filename
          fname = re.sub(r'[\\/*?:"<>|]', '_', fname)

          os.makedirs("3d-models", exist_ok=True)
          fpath = os.path.join("3d-models", fname)

          with open(fpath, "wb") as f:
              f.write(first_chunk)  # write the peeked bytes
              for chunk in resp.iter_content(8192):
                  f.write(chunk)

          size_kb = os.path.getsize(fpath) // 1024
          print(f"✅ Saved: {fname} ({size_kb}KB)")
          PYEOF

      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p 3d-models
          git add 3d-models/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            ls -lah 3d-models/
          else
            git commit -m "📦 Downloaded 3D model"
            git pull --rebase && git push
            echo "✅ Pushed!"
          fi
