name: دانلود APK با gplaydl

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'نام پکیج برنامه (مثلاً com.deepseek.chat)'
        required: true
        type: string
      architecture:
        description: 'معماری پردازنده'
        required: true
        type: choice
        options:
          - arm64
          - armv7
          - x86
          - x86_64
        default: 'arm64'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install gplaydl
        run: pip install gplaydl

      - name: Authenticate anonymously
        run: gplaydl auth

      - name: Download APK from Google Play
        env:
          PACKAGE: ${{ inputs.package_name }}
          ARCH: ${{ inputs.architecture }}
        run: |
          mkdir -p downloads
          gplaydl download $PACKAGE -a $ARCH -o downloads/

      - name: Compress and push APK
        run: |
          cd downloads
          mkdir -p ../output
          for f in *.apk; do
            [ -f "$f" ] && 7z a -mx=3 -v85m "../output/${f}.7z" "$f"
          done
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No APK downloaded."
          else
            git commit -m "Download ${{ inputs.package_name }} via gplaydl"
            git push
          fi
