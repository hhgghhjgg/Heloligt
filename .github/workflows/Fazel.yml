name: Download 3D Model from Open3DModel (ANY FILE)

on:
  workflow_dispatch:
    inputs:
      model_page:
        description: 'لینک صفحه مدل'
        required: true
        type: string
        default: 'https://open3dmodel.com/3d-models/3d-model-cute-anime-school-girl_116659.html'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            fonts-liberation \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libatspi2.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libu2f-udev \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxkbcommon0 \
            libxrandr2 \
            xdg-utils

      - name: Install Puppeteer
        run: |
          npm init -y
          npm install puppeteer

      - name: Download model with Puppeteer (COMMIT WHATEVER WE GET)
        env:
          MODEL_PAGE: ${{ inputs.model_page }}
        run: |
          node --max-old-space-size=4096 << 'NODEEOF'
          const puppeteer = require("puppeteer");
          const fs = require("fs");
          const path = require("path");

          const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));

          (async () => {
            const MODEL_PAGE = process.env.MODEL_PAGE;
            const downloadDir = path.resolve("3d-models");
            if (!fs.existsSync(downloadDir)) {
              fs.mkdirSync(downloadDir, { recursive: true });
            }

            let page = null;
            let browser = null;

            try {
              console.log("🚀 Starting browser...");
              browser = await puppeteer.launch({
                headless: "new",
                args: [
                  "--no-sandbox",
                  "--disable-setuid-sandbox",
                  "--disable-dev-shm-usage",
                  "--disable-accelerated-2d-canvas",
                  "--no-first-run",
                  "--no-zygote",
                  "--disable-gpu",
                  "--disable-web-security",
                  "--disable-features=IsolateOrigins,site-per-process"
                ]
              });

              page = await browser.newPage();
              await page.setUserAgent(
                "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
              );

              // Set download behavior
              const client = await page.target().createCDPSession();
              await client.send("Browser.setDownloadBehavior", {
                behavior: "allow",
                downloadPath: downloadDir,
                eventsEnabled: true
              });

              // Listen for downloads
              client.on("Browser.downloadProgress", (event) => {
                if (event.state === "completed") {
                  console.log(`✅ Download completed: ${event.guid}`);
                } else if (event.state === "canceled") {
                  console.log(`❌ Download canceled: ${event.guid}`);
                }
              });

              console.log("🌐 Loading model page:", MODEL_PAGE);
              await page.goto(MODEL_PAGE, {
                waitUntil: "networkidle2",
                timeout: 60000
              });

              console.log("📄 Page loaded. Waiting for scripts to settle...");
              await wait(5000);

              // Screenshot before actions
              await page.screenshot({ path: "debug_before.png" });
              console.log("📸 Screenshot saved (debug_before.png)");

              // ----------------------------------------------------------------
              // CLICK ALL DOWNLOAD LINKS WE CAN FIND
              // ----------------------------------------------------------------
              let downloadTriggered = false;

              const clickSelectors = [
                'a[href*="download"]',
                'a[href*="token_id"]',
                'a[href*="edd_action"]',
                'a[class*="download"]',
                'a[class*="edd"]',
                '.edd_download',
                '.download-link',
                'a:has-text("Download")',
                'a:has-text("download")',
                'a:has-text("Free Download")',
                'button:has-text("Download")'
              ];

              for (const selector of clickSelectors) {
                try {
                  const el = await page.$(selector);
                  if (el) {
                    const text = await el.evaluate(e => e.textContent.trim());
                    const href = await el.evaluate(e => e.href || e.getAttribute("href") || "");
                    console.log(`🖱️ Clicking: "${text}" (${href.substring(0, 80)}...)`);
                    await Promise.all([
                      el.click(),
                      page.waitForNavigation({ waitUntil: "networkidle2", timeout: 15000 }).catch(() => {})
                    ]);
                    await wait(5000);
                    downloadTriggered = true;
                    break;
                  }
                } catch (e) {
                  // next
                }
              }

              // If nothing clicked, extract links manually
              if (!downloadTriggered) {
                console.log("🔍 No clickable element worked. Extracting all links...");
                const allLinks = await page.evaluate(() =>
                  Array.from(document.querySelectorAll("a[href]")).map(a => a.href)
                );

                const downloadLinks = allLinks.filter(link =>
                  link.includes("token_id") ||
                  link.includes("edd_action") ||
                  link.includes("download.php") ||
                  link.includes("download")
                );

                console.log(`Found ${downloadLinks.length} possible download links`);
                for (const link of downloadLinks) {
                  console.log(`➡️ Trying: ${link.substring(0, 100)}`);
                  try {
                    await page.goto(link, { waitUntil: "networkidle2", timeout: 20000 });
                    await wait(5000);
                    downloadTriggered = true;
                    break;
                  } catch (e) {
                    console.log("   Failed, trying next...");
                  }
                }
              }

              // Final wait for downloads
              await wait(10000);
              await page.screenshot({ path: "debug_after.png" });
              console.log("📸 Final screenshot saved (debug_after.png)");

            } catch (error) {
              console.error("❌ Error:", error.message);
              if (page) {
                try { await page.screenshot({ path: "debug_error.png" }); } catch (e) {}
              }
            } finally {
              if (browser) {
                await browser.close();
                console.log("✅ Browser closed");
              }
            }

            // ----------------------------------------------------------------
            // VERIFY DOWNLOADED FILES (JUST REPORT, DON'T FILTER)
            // ----------------------------------------------------------------
            if (fs.existsSync(downloadDir)) {
              const files = fs.readdirSync(downloadDir).filter(f => {
                const p = path.join(downloadDir, f);
                return fs.statSync(p).isFile();
              });
              console.log(`\n📁 Files in 3d-models (${files.length}):`);

              for (const file of files) {
                const fp = path.join(downloadDir, file);
                const sizeKB = Math.round(fs.statSync(fp).size / 1024);
                console.log(`  📦 ${file} (${sizeKB}KB)`);
              }
            } else {
              console.log("⚠️ 3d-models directory does not exist.");
            }

            console.log("\n✨ Script finished!");
          })();
          NODEEOF

      - name: Commit ALL downloaded files WITHOUT CHECKING
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p 3d-models

          # Add EVERYTHING in the directory
          find 3d-models/ -type f -exec git add {} +

          if git diff --cached --quiet; then
            echo "No files to commit"
            ls -lah 3d-models/ 2>/dev/null || echo "Directory empty"
          else
            git commit -m "📦 Downloaded whatever we got! Even if it's HTML!"
            git pull --rebase && git push
            echo "✅ Committed and pushed!"
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            debug_*.png
          retention-days: 3
