name: CF-Scan-TolidMelli

on:
  workflow_dispatch:
    inputs:
      cdn:
        description: 'CDN Provider'
        required: true
        type: choice
        default: 'cloudflare'
        options:
          - 'cloudflare'
          - 'cloudfront'
          - 'fastly'
          - 'all'
      max_workers:
        description: 'Max threads'
        required: false
        type: number
        default: 400
      timeout_per_ip:
        description: 'Timeout per IP (seconds)'
        required: false
        type: number
        default: 2
      randomize:
        description: 'Randomize scan'
        required: false
        type: boolean
        default: true
      random_ips_per_range:
        description: 'Random IPs per /24 range'
        required: false
        type: number
        default: 255
      port:
        description: 'Port'
        required: false
        type: number
        default: 443

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Clone CF-Scan-TolidMelli
        run: |
          git clone https://github.com/AghaFarokh/CF-Scan-TolidMelli.git
          cd CF-Scan-TolidMelli
          echo "✅ Repository cloned"

      - name: Configure Scan
        working-directory: ./CF-Scan-TolidMelli
        run: |
          cat > config.json << 'EOF'
          {
            "cdn": "${{ github.event.inputs.cdn }}",
            "cdn_test_domains": {
              "cloudflare": "chatgpt.com",
              "cloudfront": "aws.amazon.com",
              "fastly": "github.githubassets.com"
            },
            "test_path": "/",
            "timeout": ${{ github.event.inputs.timeout_per_ip }},
            "max_workers": ${{ github.event.inputs.max_workers }},
            "test_download": true,
            "download_size": 102400,
            "port": ${{ github.event.inputs.port }},
            "randomize": ${{ github.event.inputs.randomize }},
            "random_ips_per_range": ${{ github.event.inputs.random_ips_per_range }},
            "mix_ranges": true
          }
          EOF
          echo "✅ Configuration saved:"
          cat config.json

      - name: Run Scanner
        working-directory: ./CF-Scan-TolidMelli
        run: |
          echo "🚀 Starting CF-Scan-TolidMelli..."
          
          # Map CDN choice to number for interactive prompt
          case "${{ github.event.inputs.cdn }}" in
            "cloudflare") CHOICE="1" ;;
            "cloudfront") CHOICE="2" ;;
            "fastly")      CHOICE="3" ;;
            "all")         CHOICE="4" ;;
            *)             CHOICE="1" ;;
          esac
          
          # Run scanner with piped choice
          echo "$CHOICE" | python3 cf_scanner.py || true
          
          echo "✅ Scan completed!"

      - name: Show Results
        working-directory: ./CF-Scan-TolidMelli
        run: |
          echo "=============================================="
          echo "📊 Scan Results"
          echo "=============================================="
          
          for f in working_ips_*.txt; do
            if [ -f "$f" ]; then
              COUNT=$(wc -l < "$f")
              echo ""
              echo "📁 $f ($COUNT IPs found)"
              if [ "$COUNT" -gt 0 ]; then
                echo "   Top 10 IPs:"
                head -10 "$f" | sed 's/^/   /'
              fi
            fi
          done
          
          for f in working_ips_*.json; do
            if [ -f "$f" ]; then
              COUNT=$(python3 -c "import json; print(len(json.load(open('$f'))))" 2>/dev/null || echo "?")
              echo ""
              echo "📁 $f ($COUNT entries)"
            fi
          done

      - name: Copy Results to Repository
        run: |
          mkdir -p scan-results
          cp CF-Scan-TolidMelli/working_ips_*.txt scan-results/ 2>/dev/null || true
          cp CF-Scan-TolidMelli/working_ips_*.json scan-results/ 2>/dev/null || true
          echo "✅ Results copied to scan-results/"

      - name: Commit and Push Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scan-results/
          git commit -m "📡 CF-Scan ${{ github.event.inputs.cdn }} $(date +%Y%m%d_%H%M)" || echo "Nothing to commit"
          git pull --rebase && git push || true
