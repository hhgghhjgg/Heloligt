name: Deploy VLESS Reality with Iranian SNI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # هر 4 ساعت یکبار اجرا می‌شود

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Xray
        run: |
          # Install required packages
          sudo apt-get update
          sudo apt-get install -y wget unzip

          # Download and install Xray
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip -d xray
          cd xray
          sudo mv xray /usr/local/bin/

          # Generate a UUID and keys
          USER_ID=$(/usr/local/bin/xray uuid)
          PRIVATE_KEY=$(/usr/local/bin/xray x25519 | grep "Private key" | awk '{print $3}')
          PUBLIC_KEY=$(/usr/local/bin/xray x25519 -i "$PRIVATE_KEY" | grep "Public key" | awk '{print $3}')

          # Create server configuration
          cat > /usr/local/etc/xray/config.json << EOF
{
  "log": {
    "loglevel": "warning"
  },
  "inbounds": [
    {
      "port": 443,
      "protocol": "vless",
      "settings": {
        "clients": [
          {
            "id": "$USER_ID",
            "flow": "xtls-rprx-vision"
          }
        ],
        "decryption": "none"
      },
      "streamSettings": {
        "network": "tcp",
        "security": "reality",
        "realitySettings": {
          "show": false,
          "dest": "sheypoor.com:443",
          "serverNames": [
            "sheypoor.com"
          ],
          "privateKey": "$PRIVATE_KEY"
        }
      }
    }
  ],
  "outbounds": [
    {
      "protocol": "freedom",
      "tag": "direct"
    }
  ]
}
EOF

          # Run Xray in the background
          sudo /usr/local/bin/xray run -config /usr/local/etc/xray/config.json &
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Display Connection Info
        run: |
          echo "✅ VLESS Reality is now running!"
          echo "---------------------------------"
          echo "Server IP: $(curl -s ifconfig.me)"
          echo "UUID: $USER_ID"
          echo "Public Key: $PUBLIC_KEY"
          echo ""
          echo "To connect, use the following configuration in your VLESS client (e.g., Nekobox, v2rayNG):"
          echo ""
          echo "Protocol: VLESS"
          echo "Address: $(curl -s ifconfig.me)"
          echo "Port: 443"
          echo "UUID: $USER_ID"
          echo "Flow: xtls-rprx-vision"
          echo "Security: Reality"
          echo "SNI: sheypoor.com"
          echo "Public Key (pbk): $PUBLIC_KEY"
          echo ""
          echo "The server will run for the duration of the GitHub Actions job (max 6 hours)."
          echo "---------------------------------"
          # Keep the workflow alive for 6 hours
          sleep 21600
