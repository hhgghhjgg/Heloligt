name: Fetch Telegram Posts for Personal Viewer

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کاربری کانال (بدون @)'
        required: true
        default: 'badsoccer'
      count:
        description: 'تعداد پست‌های آخر'
        required: false
        default: '60'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb 2>/dev/null
          google-chrome --version

      - name: Install Python dependencies
        run: pip install -q requests beautifulsoup4

      - name: Fetch posts from Telegram
        env:
          CHANNEL: ${{ github.event.inputs.channel }}
          COUNT: ${{ github.event.inputs.count }}
        run: |
          python3 << 'PYEOF'
          import os, json, requests, re, hashlib, subprocess, time
          from bs4 import BeautifulSoup
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urljoin, unquote

          channel = os.environ["CHANNEL"]
          target_count = int(os.environ["COUNT"])

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
          }

          # ==========================================
          # تابع fetch با Chrome Headless
          # ==========================================
          def fetch_with_chrome(url, wait_time=8):
              """باز کردن صفحه با Chrome Headless و برگردوندن HTML کامل (با JavaScript اجرا شده)"""
              try:
                  result = subprocess.run([
                      "google-chrome",
                      "--headless",
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-gpu",
                      "--disable-extensions",
                      "--disable-background-networking",
                      "--disable-sync",
                      "--no-first-run",
                      "--disable-features=TranslateUI",
                      f"--user-agent={headers['User-Agent']}",
                      f"--virtual-time-budget={wait_time * 1000}",
                      "--dump-dom",
                      url
                  ], capture_output=True, text=True, timeout=wait_time + 15)
                  if result.returncode == 0 and result.stdout:
                      return result.stdout
                  return None
              except Exception as e:
                  print(f"  ⚠️ Chrome error: {str(e)[:80]}")
                  return None

          # ==========================================
          # تابع دانلود فایل
          # ==========================================
          def safe_download(url, save_dir, timeout=60):
              """دانلود هر فایلی از اینترنت"""
              try:
                  resp = requests.get(url, headers=headers, timeout=timeout, stream=True)
                  if resp.status_code != 200:
                      return None
                  # تشخیص نام فایل
                  cd = resp.headers.get('Content-Disposition', '')
                  m = re.search(r'filename\*?=(?:UTF-8\'\')?["\']?([^"\';]+)', cd)
                  if m:
                      fname = unquote(m.group(1))
                  else:
                      fname = url.split('/')[-1].split('?')[0]
                  if not fname or len(fname) > 120:
                      ext_match = re.search(r'\.(\w+)(\?|$)', url)
                      ext = ext_match.group(1) if ext_match else 'file'
                      file_hash = hashlib.md5(url.encode()).hexdigest()[:10]
                      fname = f"doc_{file_hash}.{ext}"
                  fname = re.sub(r'[\\/*?:"<>|]', '_', fname)
                  fpath = os.path.join(save_dir, fname)
                  with open(fpath, "wb") as f:
                      for chunk in resp.iter_content(8192):
                          f.write(chunk)
                  sz = os.path.getsize(fpath) // 1024
                  print(f"    ✅ {fname} ({sz}KB)")
                  return fname
              except Exception as e:
                  print(f"    ❌ {str(e)[:50]}")
                  return None

          # ==========================================
          # Step 1: Get post list from t.me/s
          # ==========================================
          all_messages = []
          before_id = None
          channel_title = f'@{channel}'

          while len(all_messages) < target_count:
              url = f"https://t.me/s/{channel}"
              if before_id:
                  url += f"?before={before_id}"
              print(f"📡 Fetching: {url}")
              resp = requests.get(url, headers=headers, timeout=30)
              if resp.status_code != 200:
                  break
              soup = BeautifulSoup(resp.text, 'html.parser')
              if not before_id:
                  title_tag = soup.find('meta', property='og:title')
                  if title_tag:
                      channel_title = title_tag['content']
                      channel_title = re.sub(r'\s*\[ALL CHAPTERS\]', '', channel_title)
                      channel_title = re.sub(r'^Telegram:\s*(Contact\s*)?', '', channel_title)
                      channel_title = channel_title.replace('@', '').strip()
              messages = soup.find_all('div', class_='tgme_widget_message_wrap')
              if not messages:
                  break
              for msg in messages:
                  if len(all_messages) >= target_count:
                      break
                  all_messages.append(msg)
              last_msg = messages[-1]
              msg_data = last_msg.get('data-post', '')
              before_id = msg_data.split('/')[-1] if msg_data else None
              if not before_id:
                  break
              print(f"  Progress: {len(all_messages)}/{target_count}")

          latest = all_messages[:target_count]
          print(f"\n📊 Processing {len(latest)} messages")

          timestamp = datetime.now().strftime("%Y-%m-%d_%H-%M")
          output_dir = f"sites/telegram/{channel}/{timestamp}"
          media_dir = f"{output_dir}/media"
          files_dir = f"{output_dir}/files"
          Path(media_dir).mkdir(parents=True, exist_ok=True)
          Path(files_dir).mkdir(parents=True, exist_ok=True)

          owner, repo, branch = "hhgghhjgg", "Heloligt", "main"
          MEDIA_BASE_RAW = f"https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{output_dir}/media/"
          FILES_BASE_RAW = f"https://raw.githubusercontent.com/{owner}/{repo}/{branch}/{output_dir}/files/"

          posts_data = []

          for idx, msg in enumerate(latest):
              msg_id = msg.get('data-post', f'post-{idx}')
              text_div = msg.find('div', class_='tgme_widget_message_text')
              raw_text = text_div.get_text('\n', strip=True) if text_div else ""
              date_tag = msg.find('time', class_='time')
              date_str = date_tag.get('datetime', '') if date_tag else ''
              views_tag = msg.find('span', class_='tgme_widget_message_views')
              views = views_tag.get_text(strip=True) if views_tag else ''

              links = []
              if text_div:
                  for a in text_div.find_all('a', href=True):
                      href = a['href']
                      if href.startswith('/'):
                          href = f"https://t.me{href}"
                      links.append(href)

              # --- Photos (from t.me/s - simple extraction) ---
              photos = []
              for pw in msg.find_all('a', class_='tgme_widget_message_photo_wrap'):
                  style = pw.get('style', '')
                  m = re.search(r"background-image:url\('([^']+)'\)", style)
                  if m:
                      fname = safe_download(m.group(1), media_dir)
                      if fname:
                          photos.append(fname)

              # --- Videos (from t.me/s - simple extraction) ---
              videos = []
              for vt in msg.find_all('video'):
                  src = vt.get('src') or vt.get('data-video', '')
                  if src:
                      fname = safe_download(src, media_dir, timeout=120)
                      if fname:
                          videos.append(fname)

              # --- Documents: Use Chrome Headless to open the message page ---
              files_downloaded = []

              # Check if this message has a document attachment
              has_document = msg.find('a', class_='tgme_widget_message_document_wrap')
              # Also check if any link in the text goes to a single post
              post_links = [l for l in links if re.search(r't\.me/' + channel + r'/\d+$', l)]

              if has_document or post_links:
                  # Build the URL for this specific message
                  if post_links:
                      detail_url = post_links[0]
                  else:
                      detail_url = f"https://t.me/{channel}/{msg_id.split('/')[-1]}"

                  print(f"  📎 Opening with Chrome: {detail_url}")
                  html_detail = fetch_with_chrome(detail_url)

                  if html_detail:
                      detail_soup = BeautifulSoup(html_detail, 'html.parser')

                      # Extract document download links from the detailed page
                      for doc_link in detail_soup.find_all('a', class_='tgme_widget_message_document_link'):
                          direct_url = doc_link.get('href', '')
                          if direct_url:
                              # Get filename
                              doc_title = detail_soup.find('div', class_='tgme_widget_message_document_title')
                              doc_name = doc_title.get_text(strip=True) if doc_title else None
                              fname = safe_download(direct_url, files_dir, custom_name=doc_name, timeout=120)
                              if fname:
                                  files_downloaded.append(fname)

                      # Also check for direct file URLs in the detailed page
                      all_detail_links = detail_soup.find_all('a', href=True)
                      for a in all_detail_links:
                          href = a['href']
                          if 'telesco.pe/file/' in href or 'cdn' in href:
                              if href not in files_downloaded:
                                  fname = safe_download(href, files_dir, timeout=120)
                                  if fname:
                                      files_downloaded.append(fname)

                      # Check for video sources in detailed page
                      for v in detail_soup.find_all('video'):
                          src = v.get('src', '')
                          if src and src not in videos:
                              fname = safe_download(src, media_dir, timeout=120)
                              if fname:
                                  videos.append(fname)

                      # Check for images in detailed page
                      for img in detail_soup.find_all('img', src=True):
                          src = img['src']
                          if 'telesco.pe/file/' in src or 'cdn' in src:
                              if src not in photos:
                                  fname = safe_download(src, media_dir)
                                  if fname:
                                      photos.append(fname)

              # --- Also check direct file links in post text ---
              for link in links:
                  link_lower = link.lower()
                  if any(link_lower.endswith(ext) for ext in [
                      '.npvt', '.pdf', '.zip', '.rar', '.7z', '.apk', '.epub',
                      '.mobi', '.doc', '.docx', '.xls', '.xlsx', '.mp3', '.wav', '.torrent'
                  ]):
                      fname = safe_download(link, files_dir, timeout=120)
                      if fname and fname not in files_downloaded:
                          files_downloaded.append(fname)

              posts_data.append({
                  "id": msg_id, "date": date_str, "text": raw_text,
                  "views": views, "links": links,
                  "photos": photos, "videos": videos, "files": files_downloaded,
              })
              print(f"  Post {idx+1}/{len(latest)}: {len(photos)}📸 {len(videos)}🎬 {len(files_downloaded)}📄")

          # ==========================================
          # Save JSON
          # ==========================================
          with open(f"{output_dir}/posts.json", "w", encoding="utf-8") as f:
              json.dump({
                  "channel": channel, "title": channel_title,
                  "posts_count": len(posts_data), "posts": posts_data,
                  "_media_base": MEDIA_BASE_RAW, "_files_base": FILES_BASE_RAW,
              }, f, ensure_ascii=False, indent=2)

          cache_dir = "sites/telegram"
          Path(cache_dir).mkdir(parents=True, exist_ok=True)
          with open(f"{cache_dir}/{channel}.json", "w", encoding="utf-8") as f:
              json.dump({
                  "channel": channel, "title": channel_title,
                  "posts_count": len(posts_data), "posts": posts_data,
                  "cached_at": datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                  "_media_base": MEDIA_BASE_RAW, "_files_base": FILES_BASE_RAW,
              }, f, ensure_ascii=False, indent=2)

          total_files = sum(len(p['files']) for p in posts_data)
          total_photos = sum(len(p['photos']) for p in posts_data)
          total_videos = sum(len(p['videos']) for p in posts_data)
          print(f"\n✅ Done! {len(posts_data)} posts | {total_photos}📸 {total_videos}🎬 {total_files}📄")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/telegram/
          git commit -m "📡 @${{ github.event.inputs.channel }} (${{ github.event.inputs.count }} posts) | $(date '+%Y-%m-%d %H:%M')" || echo "Nothing to commit"
          git pull --rebase && git push || true
