name: Generate Xray x25519 Keys

on:
  workflow_dispatch:

jobs:
  generate-keys:
    runs-on: ubuntu-latest
    steps:
      - name: Install Xray
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip -d xray
          sudo mv xray/xray /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      - name: Generate Keys
        run: |
          echo ""
          echo "=============================================="
          echo "  🔑 Xray x25519 Key Pair"
          echo "=============================================="
          echo ""
          /usr/local/bin/xray x25519
          echo ""
          echo "=============================================="
          echo "  📋 Copy these keys to GitHub Secrets:"
          echo "  VLESS_PRIVATE_KEY = Private key"
          echo "  VLESS_PUBLIC_KEY  = Public key"
          echo "=============================================="
