name: Gemini 3.5 Flash - API Call

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # قابلیت اجرای دستی

permissions:
  contents: write      # برای commit فایل خروجی

jobs:
  call-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Call Gemini and save to file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<EOF
          import requests, json, os
          token = os.environ['GITHUB_TOKEN']
          url = "https://models.github.ai/inference/chat/completions"
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }
          data = {
              "model": "google/gemini-3.5-flash",
              "messages": [
                  {"role": "user", "content": "یک معمای ساده و جذاب به زبان فارسی بگو (فقط متن معما، بدون توضیح اضافه)"}
              ]
          }
          try:
              resp = requests.post(url, headers=headers, json=data, timeout=30)
              resp.raise_for_status()
              result = resp.json()['choices'][0]['message']['content']
          except Exception as e:
              result = f"خطا: {str(e)}"
          with open('gemini_result.txt', 'w', encoding='utf-8') as f:
              f.write(result)
          EOF

      - name: Show result in log (اختیاری)
        run: cat gemini_result.txt

      - name: Commit and push result file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gemini_result.txt
          git commit -m "Add Gemini 3.5 Flash output" || echo "No changes"
          git push