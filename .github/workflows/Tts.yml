name: List Models with Full Logs (Fail-Safe)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  list-models:
    runs-on: ubuntu-latest
    continue-on-error: true  # 🔥 مهم: حتی با خطا هم ادامه بده
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create logs directory
        run: mkdir -p _logs

      - name: Save start info
        run: |
          {
            echo "Job started at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Runner OS: ${{ runner.os }}"
          } | tee _logs/model-list.txt

      - name: Try gh models list (may fail)
        id: gh_list
        continue-on-error: true
        run: |
          {
            echo ""
            echo "=== gh models list ==="
            set -x
            gh models list 2>&1
            set +x
          } >> _logs/model-list.txt

      - name: Try API call (backup)
        id: api_call
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo ""
            echo "=== API call to catalog ==="
            set -x
            curl -s -L \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              https://models.github.ai/catalog/models 2>&1
            set +x
          } >> _logs/model-list.txt

      - name: Save final status
        run: |
          {
            echo ""
            echo "=== Job Finished ==="
            echo "Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "gh models list exit code: ${{ steps.gh_list.outcome }}"
            echo "API call exit code: ${{ steps.api_call.outcome }}"
          } >> _logs/model-list.txt

      - name: 🔥 Force commit logs even if previous steps failed
        if: always()  # 🔥 مهم: حتی با خطا هم اجرا می‌شه
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _logs/model-list.txt
          git commit -m "Add workflow logs (with errors)" || echo "No changes"
          git push

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-logs
          path: _logs/
          retention-days: 7