name: Deploy VLESS Reality with Iranian SNI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Xray
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip -d xray
          sudo mv xray/xray /usr/local/bin/
          sudo chmod +x /usr/local/bin/xray

      - name: Create Config
        run: |
          USER_ID=$(/usr/local/bin/xray uuid)
          
          sudo mkdir -p /usr/local/etc/xray

          sudo tee /usr/local/etc/xray/config.json << EOF
          {
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "port": 443,
              "protocol": "vless",
              "settings": {
                "clients": [{
                  "id": "$USER_ID",
                  "flow": "xtls-rprx-vision"
                }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp",
                "security": "reality",
                "realitySettings": {
                  "show": false,
                  "dest": "sheypoor.com:443",
                  "serverNames": ["sheypoor.com"],
                  "privateKey": "kNITNBmiUTzVBarvzUeo9vwdv5YZKCxzx5ZqadE6v08"
                }
              }
            }],
            "outbounds": [{
              "protocol": "freedom",
              "tag": "direct"
            }]
          }
          EOF

          echo "USER_ID=$USER_ID" >> $GITHUB_ENV

      - name: Run Xray
        run: |
          sudo /usr/local/bin/xray run -config /usr/local/etc/xray/config.json &
          sleep 3

      - name: Show Connection Info
        run: |
          IP=$(curl -s ifconfig.me)
          echo ""
          echo "=============================================="
          echo "  ✅ VLESS Reality is running!"
          echo "=============================================="
          echo ""
          echo "Server IP: $IP"
          echo "UUID: $USER_ID"
          echo "Public Key: yyQRS33qDcSpp8Yw2-wNeoGJYsDHwkEA9_2P4I3x3yQ"
          echo ""
          echo "--- Client Config ---"
          echo "Protocol: VLESS"
          echo "Address: $IP"
          echo "Port: 443"
          echo "UUID: $USER_ID"
          echo "Flow: xtls-rprx-vision"
          echo "Security: Reality"
          echo "SNI: sheypoor.com"
          echo "Public Key (pbk): yyQRS33qDcSpp8Yw2-wNeoGJYsDHwkEA9_2P4I3x3yQ"
          echo "Network: tcp"
          echo ""
          echo "=============================================="

      - name: Keep Alive
        run: sleep 21600
